<!DOCTYPE html><html><head><meta charset="utf-8"><title>RIPAHOLICS · Queue</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--pk:#f0189c;--bl:#0a96e8;--sk:-12deg}
html,body{margin:0;background:transparent;overflow:hidden;font-family:Montserrat,Arial,sans-serif;color:#fff}
#S{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#P{position:absolute;top:56px;width:620px}
.L #P{left:56px}.R #P{right:56px}
/* header */
#hd{position:relative;height:178px}
#hd .bx{position:absolute;inset:0 0 0 0;transform:skewX(var(--sk));border:7px solid #000;border-radius:6px;box-shadow:10px 10px 0 #000;overflow:hidden;background:var(--c1);transition:background .4s}
#hd .bx::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.09) 0 14px,transparent 14px 28px);background-size:200% 100%;animation:str 6s linear infinite}
#hd .bx::after{content:"";position:absolute;top:0;bottom:0;width:120px;left:-160px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);animation:shine 4.2s ease-in-out infinite}
@keyframes str{to{background-position:-198px 0}}
@keyframes shine{0%,55%{left:-160px}85%,100%{left:120%}}
#hd .ac{position:absolute;left:0;top:0;bottom:0;width:26px;background:var(--c2);border-right:6px solid #000;transition:background .4s}
#hd .in{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:0 30px 0 52px}#hd .tp{display:flex;align-items:center;justify-content:space-between;gap:12px}
#hd img{height:64px;align-self:flex-start;margin-top:-2px;filter:drop-shadow(3px 0 0 #000) drop-shadow(-3px 0 0 #000) drop-shadow(0 3px 0 #000) drop-shadow(0 -3px 0 #000)}
#hd .tx{min-width:0}
#hd .t1{display:flex;align-items:center;gap:10px;font-weight:900;font-size:16px;letter-spacing:4px;white-space:nowrap;background:#000;padding:5px 12px;border-radius:4px;transform:skewX(var(--sk))}
.dot{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #000;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.6);opacity:.5}}
.C .dot{animation:none;background:#777}
#st{font-family:Anton,Impact;font-size:96px;line-height:1;letter-spacing:1px;white-space:nowrap;-webkit-text-stroke:4px #000;paint-order:stroke fill;text-shadow:5px 5px 0 #000}
#st i{font-style:normal;color:var(--hl)}
#st.stamp{animation:stamp .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{0%{transform:scale(2.2) rotate(-6deg);opacity:0}60%{opacity:1}100%{transform:none}}
#hd.flash .bx{animation:hf .5s}
@keyframes hf{0%{filter:brightness(2.2)}100%{filter:none}}
.O{--c1:var(--pk);--c2:var(--bl);--hl:#fff}.LC{--c1:#ffcc00;--c2:var(--pk);--hl:#fff}.LC #st{color:#fff}.C{--c1:#26262b;--c2:#555;--hl:var(--pk)}
/* queue */
#ql{position:relative;margin-top:26px;height:620px}
.b{position:absolute;left:0;width:100%;transition:transform .55s cubic-bezier(.3,1.45,.5,1),height .4s,opacity .3s}
.b .bx{position:absolute;inset:0;transform:skewX(var(--sk));border:5px solid #000;border-radius:5px;background:#111;box-shadow:7px 7px 0 #000;overflow:hidden}
.b .in{position:absolute;inset:0;display:flex;align-items:center;gap:14px;padding:0 22px 0 14px}
.b .n{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-family:Anton,Impact;font-size:26px;background:#fff;color:#000;border:4px solid #000;transform:skewX(var(--sk))}
.b .nm{flex:1;min-width:0;font-family:Anton,Impact;font-size:30px;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;-webkit-text-stroke:2px #000;paint-order:stroke fill}
.b .nm .at{color:var(--pk)}
.b .q{flex:none;font-family:Anton,Impact;font-size:24px;background:#fff;color:#000;border:3px solid #000;padding:0 8px;transform:skewX(var(--sk))}
.b .tg{flex:none;font-weight:900;font-size:13px;letter-spacing:3px;padding:4px 10px;border:3px solid #000;transform:skewX(var(--sk))}
.b.now .bx{background:linear-gradient(100deg,#fff 0 18px,var(--pk) 18px);border-width:6px;box-shadow:10px 9px 0 #000}
.b.now .bx::after{content:"";position:absolute;top:0;bottom:0;width:90px;left:-120px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:shine 3.4s ease-in-out infinite}
.b.now .in{padding-left:34px}.b.now .n{display:none}
.b.now .nm{font-size:52px;-webkit-text-stroke:3px #000;text-shadow:4px 4px 0 #000}.b.now .nm .at{color:#fff}
.b.now .tg{background:#000;color:#fff;font-size:15px;border-color:#fff;outline:3px solid #000}
.b.now .q{font-size:30px}
.b.nx .bx{background:#16161b;border-left:16px solid var(--bl)}
.b.nx .tg{background:var(--bl)}
.b.nx .nm{font-size:34px}
.b.sel .bx{outline:4px dashed #fff;outline-offset:-12px}
.b.out{transition:transform .45s cubic-bezier(.6,0,.8,.3),opacity .45s;opacity:0}
.b.new .bx{animation:slam .5s cubic-bezier(.2,1.5,.4,1)}
.b.new .bx::before{content:"";position:absolute;inset:0;background:#fff;animation:fl .45s forwards;z-index:2}
@keyframes slam{0%{transform:translateX(var(--from)) skewX(var(--sk))}100%{transform:skewX(var(--sk))}}
@keyframes fl{to{opacity:0}}
#more{position:absolute;left:24px;font-family:Anton,Impact;font-size:26px;-webkit-text-stroke:2px #000;paint-order:stroke fill;transition:transform .5s cubic-bezier(.3,1.45,.5,1)}
#more b{color:var(--pk);font-weight:400}
#emp{position:absolute;left:0;top:0;width:100%;height:80px}
#emp .bx{position:absolute;inset:0;transform:skewX(var(--sk));border:5px dashed rgba(255,255,255,.7);background:rgba(0,0,0,.55)}
#emp span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Anton,Impact;font-size:30px;letter-spacing:1px;-webkit-text-stroke:2px #000;paint-order:stroke fill}
/* controls */
#bar{position:fixed;left:8px;right:8px;bottom:8px;z-index:99;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;background:rgba(10,10,14,.92);border:2px solid #444;border-radius:8px;font:700 13px Montserrat,Arial}
#bar button,#bar input{font:800 13px Montserrat,Arial;border:2px solid #000;border-radius:5px;padding:6px 10px}
#bar button{background:#fff;cursor:pointer}#bar .p{background:var(--pk);color:#fff}#bar .bl{background:var(--bl);color:#fff}#bar .ar{background:#c00;color:#fff}
#bar i{width:10px}#bar small{color:#999}
#bar.hid{display:none}
</style></head><body>
<div id="S"><div id="P">
 <div id="hd"><div class="bx"><div class="ac"></div></div><div class="in"><div class="tp"><img src="rb-logo-crown.png" alt=""><div class="t1"><span class="dot"></span><span id="sub">LIVE</span></div></div><div class="tx"><div id="st"></div></div></div></div>
 <div id="ql"></div>
</div></div>
<div id="bar">
<input id="bi" placeholder="@buyer" style="width:170px"><input id="qi" placeholder="Qty" value="1" style="width:44px"><button class="p" onclick="add()">+ Add</button><i></i>
<button class="bl" onclick="next()">Next &#9656;</button><button onclick="back()">&#9666; Back</button><button onclick="mv(-1)">&#9650; Move</button><button onclick="mv(1)">&#9660; Move</button><button onclick="rm()">Remove</button><button onclick="undo()">Undo</button><button id="rst" onclick="clr()">Clear</button><i></i>
<button onclick="cyS(-1)">&#9666;</button><b id="sti" style="color:#fff;min-width:80px;text-align:center"></b><button onclick="cyS(1)">&#9656;</button><i></i>
<button onclick="setSide()">Side &#8644;</button><button onclick="hideBar(1)">Hide (H)</button><small>click a bar to select</small>
</div>
<script>
const K='rb_tcg',QP=new URLSearchParams(location.search),MAX=8,$=id=>document.getElementById(id),uid=()=>Math.random().toString(36).slice(2,9);
const esc=t=>String(t).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
const ST=['open','last','closed'],STL={open:'QUEUE <i>OPEN</i>',last:'LAST CALL',closed:'QUEUE <i>CLOSED</i>'},STC={open:'O',last:'LC',closed:'C'},SUB={open:'LIVE NOW',last:'FINAL SPOTS',closed:'THANKS FOR RIPPING'};
let S,H=[],sel=null,side=QP.get('side')||localStorage.rb_tcg_side||'right';
function load(){try{S=JSON.parse(localStorage[K]||'{}')}catch(e){S={}}S.q=(S.q||[]).map(e=>({id:e.id||uid(),b:e.b,n:Math.max(1,e.n|0||1)}));S.c=S.c|0;if(!ST.includes(S.st))S.st=S.open?'open':'closed'}
function save(){S.open=S.st!=='closed';localStorage[K]=JSON.stringify(S)}
function snap(){H.push(localStorage[K]||'{}');if(H.length>50)H.shift()}
function nm(b){b=String(b).trim();return b.startsWith('@')?'<span class="at">@</span>'+esc(b.slice(1)):esc(b)}
function left(){return S.q.slice(Math.min(S.c,S.q.length))}
function fit(){const z=Math.min(innerWidth/1920,innerHeight/1080);$('S').style.transform=`scale(${z})`}
function applySide(){document.body.classList.remove('L','R');document.body.classList.add(side==='left'?'L':'R')}
function setSide(){side=side==='left'?'right':'left';localStorage.rb_tcg_side=side;applySide();draw()}
function shrink(el,mx,mn){let f=mx;el.style.fontSize=f+'px';while(el.scrollWidth>el.clientWidth+1&&f>mn){f-=2;el.style.fontSize=f+'px'}}
function drawTop(){const h=$('hd');document.body.classList.remove('O','LC','C');document.body.classList.add(STC[S.st]);
 if($('st').dataset.s!==S.st){const first=$('st').dataset.s==null;$('st').dataset.s=S.st;$('st').innerHTML=STL[S.st];$('sub').textContent=SUB[S.st];if(!first){$('st').classList.remove('stamp');void $('st').offsetWidth;$('st').classList.add('stamp');h.classList.remove('flash');void h.offsetWidth;h.classList.add('flash')}shrink($('st'),96,56)}
 $('sti').textContent=S.st.toUpperCase()}
const HG=[104,74,58],GAP=12;
function draw(o={}){drawTop();const ql=$('ql'),l=left(),vis=l.slice(0,MAX),keep={};let y=0;const from=side==='left'?'-700px':'700px';
 vis.forEach((e,i)=>{let el=ql.querySelector(`.b[data-id="${e.id}"]`);const fresh=!el;
  if(fresh){el=document.createElement('div');el.className='b';el.dataset.id=e.id;el.onclick=()=>{const p=S.q.findIndex(x=>x.id===el.dataset.id);sel=sel===p?null:p;draw()};el.style.transition='none';el.style.transform=`translateY(${y+(o.ni===e.id?0:40)}px)`;if(o.ni!==e.id)el.style.opacity=0;ql.appendChild(el)}
  const h=HG[Math.min(i,2)],p=S.c+i,cls=i===0?'now':i===1?'nx':'';
  el.innerHTML=`<div class="bx"></div><div class="in"><span class="n">${p+1}</span><span class="nm">${nm(e.b)}</span>${e.n>1?`<span class="q">x${e.n}</span>`:''}${i===0?'<span class="tg">NOW</span>':i===1?'<span class="tg">NEXT</span>':''}</div>`;
  el.className='b '+cls+(sel===p?' sel':'')+(o.ni===e.id&&fresh?' new':'');el.style.setProperty('--from',from);el.style.height=h+'px';el.style.zIndex=100-i;
  if(fresh){void el.offsetWidth;el.style.transition=''}
  el.style.transitionDelay=(o.stag?i*55:0)+'ms';el.style.transform=`translateY(${y}px)`;el.style.opacity=1;
  shrink(el.querySelector('.nm'),i===0?52:i===1?34:30,18);y+=h+GAP;keep[e.id]=1});
 ql.querySelectorAll('.b').forEach(el=>{if(!keep[el.dataset.id]&&!el.classList.contains('out'))el.remove()});
 let m=$('more');if(l.length>MAX){if(!m){m=document.createElement('div');m.id='more';ql.appendChild(m)}m.innerHTML=`<b>+${l.length-MAX}</b> MORE IN LINE`;m.style.transform=`translateY(${y+2}px)`}else if(m)m.remove();
 let em=$('emp');if(!l.length){if(!em){em=document.createElement('div');em.id='emp';em.innerHTML='<div class="bx"></div><span></span>';ql.appendChild(em)}em.querySelector('span').textContent=S.st==='closed'?'SEE YOU NEXT BREAK':'DROP YOUR NAME IN CHAT'}else if(em)em.remove()}
function add(){let b=$('bi').value.trim();if(!b)return $('bi').focus();if(!b.startsWith('@'))b='@'+b;snap();const id=uid();S.q.push({id,b,n:Math.max(1,parseInt($('qi').value)||1)});save();$('bi').value='';$('qi').value='1';$('bi').focus();draw({ni:id})}
['bi','qi'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')add();e.stopPropagation()}));
function next(){if(S.c>=S.q.length)return;snap();const e=S.q[S.c],el=document.querySelector(`.b[data-id="${e.id}"]`);
 if(el){el.classList.add('out');el.style.transitionDelay='0ms';el.style.transform=`translate(${side==='left'?-760:760}px,0)`;setTimeout(()=>el.remove(),460)}
 S.c++;sel=null;save();setTimeout(()=>draw({stag:1}),140)}
function back(){if(S.c<=0)return;snap();S.c--;sel=null;save();draw({ni:S.q[S.c].id,stag:1})}
function tgt(){return sel!=null&&sel>=S.c&&sel<S.q.length?sel:S.q.length-1}
function rm(){const p=tgt();if(p<S.c||p<0)return;snap();S.q.splice(p,1);sel=null;save();draw({stag:1})}
function mv(d){if(sel==null||sel<S.c)return;const n=sel+d;if(n<S.c||n>=S.q.length)return;snap();[S.q[sel],S.q[n]]=[S.q[n],S.q[sel]];sel=n;save();draw()}
function undo(){const p=H.pop();if(p==null)return;localStorage[K]=p;load();sel=null;draw()}
let ct=0;function clr(){const b=$('rst');if(Date.now()-ct>2500){ct=Date.now();b.textContent='Tap again to clear';b.classList.add('ar');setTimeout(()=>{b.textContent='Clear';b.classList.remove('ar')},2500);return}snap();S.q=[];S.c=0;sel=null;save();b.textContent='Clear';b.classList.remove('ar');ct=0;draw()}
function cyS(d){S.st=ST[(ST.indexOf(S.st)+d+3)%3];save();drawTop();draw()}
function hideBar(h){$('bar').classList.toggle('hid',!!h);localStorage.rb_tcg_bar=h?'0':'1'}
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='h'||e.key==='H')hideBar(!$('bar').classList.contains('hid'))});
addEventListener('storage',e=>{if(e.key===K){load();draw()}});addEventListener('resize',fit);
load();save();applySide();fit();if(QP.get('controls')==='0'||localStorage.rb_tcg_bar==='0')hideBar(1);draw();if(document.fonts)document.fonts.ready.then(()=>{$('st').dataset.s='';drawTop();$('st').classList.remove('stamp');draw()});
</script></body></html>
