<!DOCTYPE html><html><head><meta charset="utf-8"><title>RIPAHOLICS TCG Queue (v2)</title><style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@700;800;900&display=swap');
:root{--pk:#f0189c;--bl:#0a96e8;--pu:#5b2a9e;--ink:#0b0b0f;--grad:linear-gradient(115deg,#0a96e8,#5b2a9e 50%,#f0189c)}
html,body{margin:0;background:transparent;user-select:none;overflow:hidden;width:100%;height:100%}
#S{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#000 url('rb-inksmoke-bg.jpg') center/cover no-repeat;font-family:Montserrat,Arial,sans-serif;color:#fff}
#S::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 30% 45%,rgba(0,0,0,.15),rgba(0,0,0,.6) 75%);pointer-events:none}
#S>*{position:absolute;z-index:1}
.ant{font-family:Anton,Impact,sans-serif;font-weight:400;-webkit-text-stroke:3px #000;paint-order:stroke fill;text-shadow:4px 4px 0 #000}
.box{background:var(--ink);border:4px solid #000;box-shadow:0 0 0 3px #fff,0 8px 0 #000;border-radius:16px}
.lbl{display:inline-block;font-weight:900;font-size:16px;letter-spacing:3px;border:3px solid #000;border-radius:8px;padding:3px 12px;background:#fff;color:#000}
.lbl.pk{background:var(--pk);color:#fff}
/* header */
#hd{left:48px;top:30px;right:48px;height:110px;display:flex;align-items:center;gap:26px}
#logo{height:96px;filter:drop-shadow(3px 0 0 #000) drop-shadow(-3px 0 0 #000) drop-shadow(0 3px 0 #000) drop-shadow(0 -3px 0 #000) drop-shadow(5px 5px 0 #000)}
#ttl{font-size:64px;letter-spacing:5px;line-height:1}
#ttl i{font-style:normal;color:var(--pk)}
#qb{margin-left:auto;font-size:44px;letter-spacing:5px;line-height:1;padding:12px 34px 16px;border-radius:14px;border:4px solid #000;box-shadow:0 0 0 3px #fff,0 7px 0 #000;background:var(--grad)}
#qb .in{display:inline-block;animation:pl 1.6s ease-in-out infinite}
#qb.last{background:var(--pk)}#qb.last .in{animation:pl .8s ease-in-out infinite}
#qb.closed{background:var(--ink)}#qb.closed .in{animation:none}#qb.closed span{color:var(--pk)}
#qb.pop .in{animation:pop .5s cubic-bezier(.2,1.6,.4,1),pl 1.6s ease-in-out .5s infinite}
#pl{text-align:center;padding:8px 22px 10px;min-width:150px}
#pl .v{font-size:58px;line-height:1;letter-spacing:2px}
#pl .k{font-weight:900;font-size:14px;letter-spacing:3px;color:var(--bl)}
#pl.bump .v{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.55)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
/* hero */
#hero{left:48px;top:178px;width:1110px;height:520px;overflow:hidden;background:linear-gradient(115deg,rgba(10,150,232,.32),rgba(91,42,158,.30) 50%,rgba(240,24,156,.40)),var(--ink)}
#hero .tag{position:absolute;left:36px;top:34px;font-size:22px;padding:6px 16px}
#hero .tag::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid #000;margin-right:10px;vertical-align:1px;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}
#hb{position:absolute;left:36px;top:130px;width:600px}
#hn{font-size:104px;text-overflow:clip;line-height:1.05;letter-spacing:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px 6px 0}
#hn .at{color:var(--bl)}
#hp{font-weight:900;font-size:32px;line-height:1.2;margin-top:10px;max-height:78px;overflow:hidden}
#hq{display:flex;gap:14px;margin-top:26px;align-items:center}
#hq .pk2{font-family:Anton,Impact;font-size:30px;letter-spacing:2px;background:#fff;color:#000;border:3px solid #000;border-radius:10px;padding:4px 16px;box-shadow:0 5px 0 #000}
#hq .pk2 b{font-weight:400;color:var(--pk)}
#dots{display:flex;gap:8px;flex-wrap:wrap;max-width:420px}
#dots i{width:22px;height:30px;border:3px solid #000;border-radius:4px;background:#fff;box-shadow:0 3px 0 #000}
#dots i.d{background:#333;opacity:.6}
#hero.empty #hb{top:180px}
#hero.go #hb{animation:hin .8s cubic-bezier(.2,1.3,.4,1)}
#hero.go::after{content:"";position:absolute;top:0;bottom:0;width:30%;left:-40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:sh .9s ease-out .15s both}
@keyframes hin{0%{transform:translateX(-80px);opacity:0}100%{transform:none;opacity:1}}
@keyframes sh{to{left:130%}}
/* pack art */
#packs{position:absolute;right:40px;top:40px;width:400px;height:440px}
.pack{position:absolute;width:210px;height:340px;top:50px;left:95px;border-radius:6px;border:4px solid #000;box-shadow:8px 8px 0 #000;background:var(--grad);overflow:visible}
.pack::before,.pack .tp{content:"";position:absolute;left:-4px;right:-4px;height:22px;background:repeating-linear-gradient(90deg,#d8d8de 0 6px,#9a9aa4 6px 12px);border:4px solid #000}
.pack::before{bottom:-4px;border-radius:0 0 6px 6px}
.pack .tp{top:-4px;border-radius:6px 6px 0 0}
.pack .fc{position:absolute;inset:26px 14px;border:3px solid #000;border-radius:6px;background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.35),transparent 55%),linear-gradient(160deg,rgba(255,255,255,.25),transparent 40%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden}
.pack .fc img{width:150px;filter:drop-shadow(2px 0 0 #000) drop-shadow(-2px 0 0 #000) drop-shadow(0 2px 0 #000) drop-shadow(0 -2px 0 #000)}
.pack .fc span{font-family:Anton,Impact;font-size:26px;letter-spacing:2px;text-align:center;line-height:1.05;-webkit-text-stroke:2px #000;paint-order:stroke fill;padding:0 6px;max-height:84px;overflow:hidden}
.pack .fc::after{content:"";position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);animation:foil 3.5s ease-in-out infinite}
@keyframes foil{0%{transform:translateX(-40%)}60%,100%{transform:translateX(40%)}}
.pack.b1{transform:rotate(-12deg) translate(-90px,20px);filter:brightness(.55)}
.pack.b2{transform:rotate(11deg) translate(90px,20px);filter:brightness(.55)}
.pack.f{z-index:2}
.card{position:absolute;z-index:1;left:125px;top:90px;width:150px;height:210px;border-radius:10px;border:4px solid #000;background:linear-gradient(135deg,#fff,#ddd);opacity:0}
.card::after{content:"";position:absolute;inset:10px;border-radius:6px;border:3px solid #000;background:var(--grad)}
#packs.rip .f{animation:shake .5s ease-in-out}
#packs.rip .f .tp{animation:tear 1.2s .45s cubic-bezier(.3,.7,.4,1) both}
#packs.rip .card{animation:cardup 2.2s .7s cubic-bezier(.2,1.2,.4,1) both}
@keyframes shake{20%{transform:rotate(-4deg)}40%{transform:rotate(4deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(2deg)}}
@keyframes tear{0%{transform:none}35%{transform:translate(30px,-50px) rotate(18deg);opacity:1}100%{transform:translate(120px,-160px) rotate(50deg);opacity:0}}
@keyframes cardup{0%{opacity:1;transform:translateY(40px);z-index:3}40%{opacity:1;transform:translateY(-150px) rotate(-6deg);z-index:3}75%{opacity:1;transform:translateY(-150px) rotate(-6deg) scale(1.05);z-index:3}100%{opacity:0;transform:translateY(-150px) rotate(-6deg) scale(1.1);z-index:3}}
/* up next */
#un{left:48px;top:730px;width:1110px;height:120px;display:flex;align-items:center;gap:26px;padding:0 30px;box-sizing:border-box}
#un .lbl{font-size:24px;padding:8px 18px;background:var(--bl);color:#fff;white-space:nowrap}
#un .nm{font-size:56px;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;max-width:520px;padding-bottom:4px}
#un .pr{flex:1;min-width:0;font-weight:900;font-size:24px;color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#un .qt{font-family:Anton,Impact;font-size:30px;background:#fff;color:#000;border:3px solid #000;border-radius:10px;padding:2px 14px;white-space:nowrap}
#un.go .nm,#un.go .pr{animation:hin .7s cubic-bezier(.2,1.3,.4,1)}
/* queue */
#ql{left:1196px;top:178px;width:676px;height:672px;box-sizing:border-box;padding:22px 22px 18px}
#ql h2{margin:0 0 16px;display:flex;align-items:center;justify-content:space-between;font-size:40px;letter-spacing:4px;line-height:1}
#ql h2 .lbl{font-size:16px;letter-spacing:2px;-webkit-text-stroke:0;text-shadow:none;font-family:Montserrat}
#q{display:flex;flex-direction:column;height:556px;overflow:hidden}
.r{display:flex;align-items:center;gap:14px;background:#15151c;border:3px solid #000;box-shadow:0 0 0 2px rgba(255,255,255,.85),0 4px 0 #000;border-radius:12px;padding:0 14px 0 8px;height:62px;margin:2px 2px 12px;flex:none;transition:height .45s,margin .45s,opacity .45s,transform .45s;overflow:hidden}
.r .n{flex:0 0 46px;height:46px;display:flex;align-items:center;justify-content:center;font-family:Anton,Impact;font-size:28px;border:3px solid #000;border-radius:9px;background:#fff;color:#000}
.r .b{flex:0 1 auto;max-width:250px;font-weight:900;font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .b .at,#un .at{color:var(--bl)}
.r .it{flex:1;min-width:0;font-weight:800;font-size:16px;color:#bbb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .x{font-family:Anton,Impact;font-size:22px;border:2px solid #000;border-radius:6px;padding:0 9px;background:#fff;color:#000}
.r.cur{background:linear-gradient(115deg,rgba(10,150,232,.45),rgba(91,42,158,.4) 50%,rgba(240,24,156,.55)),#15151c;box-shadow:0 0 0 3px #fff,0 4px 0 #000}
.r.cur .n{background:var(--pk);color:#fff;-webkit-text-stroke:1.5px #000;paint-order:stroke fill}
.r.cur .it{color:#fff}
.r.nx .n{background:var(--bl);color:#fff;-webkit-text-stroke:1.5px #000;paint-order:stroke fill}
.r.sel{box-shadow:0 0 0 3px var(--pk),0 4px 0 #000}
.r.out{height:0;margin-top:0;margin-bottom:0;opacity:0;transform:translateX(-60px);border-width:0}
.r.in{animation:rin .55s cubic-bezier(.2,1.5,.4,1)}
@keyframes rin{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
#more{text-align:center;font-weight:900;font-size:18px;margin-top:auto}#more b{color:var(--pk)}
#emp{text-align:center;font-size:34px;letter-spacing:2px;padding:200px 0}
/* bottom */
#hs{left:48px;top:886px;width:1110px;height:110px;box-sizing:border-box;display:flex;align-items:center;gap:18px;padding:0 22px;overflow:hidden}
#hs .lbl{flex:none}
#ht{display:flex;gap:12px;overflow:hidden;flex:1;min-width:0}
.hc{flex:none;display:flex;flex-direction:column;justify-content:center;background:#15151c;border:3px solid #000;box-shadow:0 0 0 2px #fff;border-radius:10px;padding:5px 14px;max-width:230px}
.hc b{font-family:Anton,Impact;font-weight:400;font-size:22px;letter-spacing:1px;color:var(--pk);white-space:nowrap;line-height:1.1}
.hc span{font-weight:900;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc.new{animation:rin .6s cubic-bezier(.2,1.5,.4,1)}
#ht .no{font-weight:800;font-size:18px;color:#999;letter-spacing:1px}
#now{left:1196px;top:886px;width:676px;height:110px;box-sizing:border-box;padding:12px 24px;display:flex;flex-direction:column;justify-content:center}
#now small{font-weight:900;font-size:14px;letter-spacing:3px;color:var(--pk)}
#now .pr{font-family:Anton,Impact;font-size:36px;letter-spacing:1px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#now .op{font-weight:800;font-size:18px;color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* hit burst */
#hit{inset:0;z-index:40;display:none;align-items:center;justify-content:center;pointer-events:none;overflow:hidden}
#hit.on{display:flex}
#hit .dim{position:absolute;inset:0;background:rgba(0,0,0,.78);animation:fi .35s both}
#hit .ray{position:absolute;left:50%;top:50%;width:2800px;height:2800px;margin:-1400px 0 0 -1400px;background:repeating-conic-gradient(from 0deg,rgba(10,150,232,.55) 0 7deg,transparent 7deg 15deg,rgba(91,42,158,.5) 15deg 22deg,transparent 22deg 30deg,rgba(240,24,156,.6) 30deg 37deg,transparent 37deg 45deg);-webkit-mask-image:radial-gradient(closest-side,#000 15%,transparent 70%);mask-image:radial-gradient(closest-side,#000 15%,transparent 70%);animation:spin 14s linear infinite,ri .6s cubic-bezier(.2,1.3,.4,1) both}
#hit .ct{position:relative;text-align:center;animation:hpop .7s .15s cubic-bezier(.2,1.6,.4,1) both}
#hit .k{display:inline-block;font-weight:900;font-size:30px;letter-spacing:10px;background:#fff;color:#000;border:4px solid #000;border-radius:10px;padding:6px 26px;box-shadow:0 6px 0 #000}
#hit .t{font-size:230px;line-height:1.05;letter-spacing:8px;-webkit-text-stroke:8px #000;text-shadow:12px 12px 0 #000;margin:14px 0 6px;white-space:nowrap}
#hit .t span{color:var(--pk)}
#hit .bn{display:inline-block;font-size:70px;letter-spacing:2px;background:var(--grad);border:5px solid #000;box-shadow:0 0 0 4px #fff,0 9px 0 #000;border-radius:16px;padding:6px 40px 12px}
#hit .bn .at{color:#fff}
#hit .fl{position:absolute;inset:0;background:#fff;animation:fl .5s both}
#hit.out .ct{animation:hout .6s both}#hit.out .dim,#hit.out .ray{animation:fo .6s both}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ri{from{transform:scale(.2);opacity:0}}
@keyframes hpop{0%{transform:scale(.3);opacity:0}100%{transform:none;opacity:1}}
@keyframes hout{to{transform:scale(1.3);opacity:0}}
@keyframes fl{from{opacity:.9}to{opacity:0}}
@keyframes fi{from{opacity:0}}@keyframes fo{to{opacity:0}}
/* controls */
#bar{position:fixed;left:8px;right:8px;bottom:8px;z-index:100;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;border-radius:10px;background:rgba(0,0,0,.85);border:2px solid #fff;opacity:.15;font-family:Montserrat,Arial}
#bar:hover,#bar:focus-within{opacity:1}#bar.hide{display:none}
#bar button{font-family:Montserrat,Arial;font-weight:800;font-size:12px;padding:5px 10px;border:2px solid #000;border-radius:6px;background:#fff;color:#000;cursor:pointer}
#bar button.p{background:var(--pk);color:#fff}#bar button.b{background:var(--bl);color:#fff}
#bar input{font-family:Montserrat,Arial;font-weight:800;font-size:12px;padding:4px 6px;border:2px solid #000;border-radius:6px;width:110px}
#bar .cy{display:inline-flex;align-items:center;gap:2px;color:#fff;font-weight:900;font-size:12px}
#bar .cy span{min-width:96px;text-align:center}
#bar .sp{width:1px;height:22px;background:#666;margin:0 2px}
#shw{position:fixed;right:6px;bottom:6px;z-index:101;font:800 11px Montserrat;padding:3px 8px;border-radius:6px;border:2px solid #000;opacity:.15;cursor:pointer;display:none}
</style></head><body>
<div id="S">
<div id="hd"><img id="logo" src="rb-logo-crown.png" alt="RIPAHOLICS"><div id="ttl" class="ant">TCG <i>BREAKS</i></div><div id="qb" class="ant"></div><div id="pl" class="box"><div class="v ant">0</div><div class="k">PACKS LEFT</div></div></div>
<div id="hero" class="box"><span class="tag lbl pk">NOW RIPPING</span><div id="hb"></div>
<div id="packs"><div class="pack b1"><div class="tp"></div><div class="fc"><img src="rb-logo-crown.png" alt=""></div></div><div class="pack b2"><div class="tp"></div><div class="fc"><img src="rb-logo-crown.png" alt=""></div></div><div class="card"></div><div class="pack f"><div class="tp"></div><div class="fc"><img src="rb-logo-crown.png" alt=""><span id="pkn">BOOSTER</span></div></div></div></div>
<div id="un" class="box"></div>
<div id="ql" class="box"><h2 class="ant">THE LINE <span class="lbl" id="cnt">0 IN LINE</span></h2><div id="q"></div></div>
<div id="hs" class="box"><span class="lbl pk">SESSION HITS</span><div id="ht"></div></div>
<div id="now" class="box"></div>
<div id="hit"></div>
</div>
<div id="bar">
<button onclick="go('mlb')">MLB</button><button onclick="go('nfl')">NFL</button><button onclick="go('nba')">NBA</button><button class="p">TCG</button><i class="sp"></i>
<input id="bi" placeholder="@buyer"><input id="ii" placeholder="Product" style="width:170px"><input id="qi" placeholder="Qty" style="width:44px" value="1"><button onclick="add()">+ Add</button><i class="sp"></i>
<button class="p" onclick="rip()">RIP PACK</button><button class="b" onclick="next()">Next &#9656;</button><button onclick="back()">&#9666; Back</button><button onclick="mv(-1)">&#9650;</button><button onclick="mv(1)">&#9660;</button><button onclick="rm()">Remove</button><button onclick="undo()">Undo</button><button id="rst" onclick="clr(this)">Clear</button><i class="sp"></i>
<span class="cy"><button onclick="cyS(-1)">&#9666;</button><span id="sti"></span><button onclick="cyS(1)">&#9656;</button></span><i class="sp"></i>
<span class="cy"><button onclick="cyH(-1)">&#9666;</button><span id="hti"></span><button onclick="cyH(1)">&#9656;</button></span><button class="p" onclick="hit()">HIT!</button><button onclick="clrHits()">Clear Hits</button><i class="sp"></i>
<input id="pdi" placeholder="Product (corner)" style="width:150px" oninput="setInfo()"><input id="opi" placeholder="Opening" oninput="setInfo()"><button onclick="hideBar(1)">Hide</button>
</div><button id="shw" onclick="hideBar(0)">controls</button>
<script>
const K='rb_tcg',QP=new URLSearchParams(location.search),MAX=parseInt(QP.get('show')||'8',10)||8,esc=t=>String(t).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
const ST=['open','last','closed'],STL={open:'QUEUE <span>OPEN</span>',last:'LAST CALL',closed:'QUEUE <span>CLOSED</span>'};
const HT=['EX','FULL ART','ILLUSTRATION RARE','SIR','GOLD','CHASE'];
const $=id=>document.getElementById(id);
let S,sel=null,H=[],busy=false;
function load(){try{S=JSON.parse(localStorage[K]||'{}')}catch(e){S={}}S.q=(S.q||[]).map(e=>({b:e.b,i:e.i||'',n:Math.max(1,e.n|0||1)}));S.c=S.c|0;S.d=S.d|0;
 if(!ST.includes(S.st))S.st=S.open?'open':'closed';S.hits=S.hits||[];S.ht=S.ht|0}
function save(){S.open=S.st!=='closed';localStorage[K]=JSON.stringify(S)}
function snap(){H.push(localStorage[K]||'{}');if(H.length>50)H.shift()}
function go(l){localStorage.rb_lg=l;location.href='team-board.html?league='+l}
function nm(b){b=String(b).trim();return b.startsWith('@')?'<span class="at">@</span>'+esc(b.slice(1)):esc(b)}
function left(){return S.q.slice(Math.min(S.c,S.q.length))}
function packsLeft(){return Math.max(0,left().reduce((a,e)=>a+e.n,0)-S.d)}
function retrig(el,c){el.classList.remove(c);void el.offsetWidth;el.classList.add(c)}
function drawHero(go){const l=left(),h=$('hero'),e=l[0],hb=$('hb');
 if(!e){h.classList.add('empty');hb.innerHTML=`<div id="hn" class="ant" style="font-size:80px">${S.st==='closed'?'BREAK CLOSED':'DROP YOUR ORDER'}</div><div id="hp">${S.st==='closed'?'Thanks for ripping with us!':'Type your spot in chat to get in line'}</div>`;$('pkn').textContent='RIPAHOLICS';return}
 h.classList.remove('empty');const d=Math.min(S.d,e.n);
 hb.innerHTML=`<div id="hn" class="ant">${nm(e.b)}</div><div id="hp">${esc(e.i||'Mystery Pack')}</div><div id="hq"><span class="pk2">PACK <b>${Math.min(d+1,e.n)}</b> / ${e.n}</span><div id="dots">${e.n<=14?Array.from({length:e.n},(_,i)=>`<i class="${i<d?'d':''}"></i>`).join(''):''}</div></div>`;
 shrink($('hn'),104,56);$('pkn').textContent=(e.i||'BOOSTER').toUpperCase();if(go)retrig(h,'go')}
function shrink(el,mx,mn){let f=mx;el.style.fontSize=f+'px';while(el.scrollWidth>el.clientWidth+1&&f>mn){f-=4;el.style.fontSize=f+'px'}el.style.textOverflow='ellipsis'}
function drawUN(go){const e=left()[1],u=$('un');u.innerHTML=e?`<span class="lbl">UP NEXT</span><div class="nm ant">${nm(e.b)}</div><div class="pr">${esc(e.i)}</div><span class="qt">x${e.n}</span>`:`<span class="lbl">UP NEXT</span><div class="pr">${S.st==='closed'?'Queue closed':'Your name could be here — grab a spot!'}</div>`;if(go)retrig(u,'go')}
function drawQ(newIdx){const l=left(),qe=$('q'),c=Math.min(S.c,S.q.length);$('cnt').textContent=l.length+' IN LINE';
 if(!l.length){qe.innerHTML='<div id="emp" class="ant">NO ONE IN LINE</div>';return}
 qe.innerHTML=l.slice(0,MAX).map((e,i)=>{const p=c+i;return `<div class="r${i===0?' cur':''}${i===1?' nx':''}${sel===p?' sel':''}${p===newIdx?' in':''}" data-p="${p}"><div class="n">${p+1}</div><div class="b">${nm(e.b)}</div><div class="it">${esc(e.i)}</div><span class="x">x${e.n}</span></div>`}).join('')+(l.length>MAX?`<div id="more"><b>+${l.length-MAX}</b> MORE IN LINE</div>`:'');
 qe.querySelectorAll('.r').forEach(r=>r.onclick=()=>{const p=+r.dataset.p;sel=sel===p?null:p;drawQ()})}
function drawTop(){const b=$('qb');if(b.dataset.s!==S.st){b.dataset.s=S.st;b.className='ant '+S.st;b.innerHTML='<span class="in">'+STL[S.st]+'</span>';retrig(b,'pop')}
 $('sti').textContent=S.st.toUpperCase();$('hti').textContent=HT[S.ht%HT.length];
 const v=$('pl').querySelector('.v'),n=String(packsLeft());if(v.textContent!==n){v.textContent=n;retrig($('pl'),'bump')}}
function drawHits(nw){const t=$('ht');t.innerHTML=S.hits.length?S.hits.slice().reverse().slice(0,6).map((h,i)=>`<div class="hc${nw&&i===0?' new':''}"><b>${esc(h.t)}</b><span>${nm(h.b)}</span></div>`).join(''):'<span class="no">Hits will show up here</span>'}
function draw(o={}){drawTop();drawHero(o.go);drawUN(o.go);drawQ(o.ni);drawHits()}
function add(){let b=$('bi').value.trim();if(!b)return $('bi').focus();if(!b.startsWith('@'))b='@'+b;snap();S.q.push({b,i:$('ii').value.trim(),n:Math.max(1,parseInt($('qi').value)||1)});const ni=S.q.length-1;save();$('bi').value='';$('ii').value='';$('qi').value='1';$('bi').focus();draw({ni,go:left().length<=2})}
['bi','ii','qi'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')add()}));
function rip(){const e=left()[0];if(!e)return;if(S.d>=e.n)return next();snap();S.d++;save();retrig($('packs'),'rip');setTimeout(()=>{drawTop();drawHero()},900)}
function next(){if(busy||S.c>=S.q.length)return;busy=true;snap();const r=$('q').querySelector('.r.cur');if(r)r.classList.add('out');
 setTimeout(()=>{S.c++;S.d=0;sel=null;save();const ni=S.c+MAX-1;draw({go:true,ni});busy=false},r?480:0)}
function back(){if(S.c<=0)return;snap();S.c--;S.d=0;save();draw({go:true})}
function tgt(){return sel!=null&&sel>=S.c&&sel<S.q.length?sel:S.q.length-1}
function rm(){const p=tgt();if(p<S.c||p<0)return;snap();S.q.splice(p,1);if(p===S.c)S.d=0;sel=null;save();draw({go:p<=S.c+1})}
function mv(d){if(sel==null||sel<S.c)return;const n=sel+d;if(n<S.c||n>=S.q.length)return;snap();[S.q[sel],S.q[n]]=[S.q[n],S.q[sel]];sel=n;save();draw()}
function undo(){const p=H.pop();if(p==null)return;localStorage[K]=p;load();sel=null;draw()}
function cyS(d){S.st=ST[(ST.indexOf(S.st)+d+3)%3];save();draw()}
function cyH(d){S.ht=(S.ht+d+HT.length)%HT.length;save();drawTop()}
let hto;function hit(){const e=left()[0],b=e?e.b:'@ripaholics',t=HT[S.ht%HT.length];S.hits.push({b,t});save();
 const w=t.split(' '),tt=w.length>1?esc(w.slice(0,-1).join(' '))+' <span>'+esc(w[w.length-1])+'</span>':'<span>'+esc(t)+'</span>';
 const x=$('hit');x.className='';x.innerHTML=`<div class="dim"></div><div class="ray"></div><div class="fl"></div><div class="ct"><div class="k">BIG HIT</div><div class="t ant" style="font-size:${t.length>12?140:t.length>8?180:230}px">${tt}</div><div class="bn ant">${nm(b)}</div></div>`;x.classList.add('on');
 clearTimeout(hto);hto=setTimeout(()=>{x.classList.add('out');hto=setTimeout(()=>{x.className='';drawHits(1)},600)},5000)}
function clrHits(){snap();S.hits=[];save();drawHits()}
let rt;function clr(b){if(b.dataset.arm){clearTimeout(rt);delete b.dataset.arm;b.textContent='Clear';b.style.background='';snap();S.q=[];S.c=0;S.d=0;sel=null;save();draw();return}b.dataset.arm=1;b.textContent='Tap again to clear';b.style.background='#f0189c';rt=setTimeout(()=>{delete b.dataset.arm;b.textContent='Clear';b.style.background=''},3000)}
function showInfo(){const pd=(localStorage.rb_prod_tcg||'').trim(),op=(localStorage.rb_open_tcg||'').trim(),w=$('now');w.innerHTML='<small>NOW OPENING</small><div class="pr">'+esc(pd||'Pokémon TCG')+'</div>'+(op?'<div class="op">'+esc(op)+'</div>':'');[['pdi','rb_prod_tcg'],['opi','rb_open_tcg']].forEach(([id,k])=>{const e=$(id);if(document.activeElement!==e)e.value=localStorage[k]||''})}
function setInfo(){localStorage.rb_prod_tcg=$('pdi').value;localStorage.rb_open_tcg=$('opi').value;showInfo()}
function hideBar(h){$('bar').classList.toggle('hide',!!h);$('shw').style.display=h?'block':'none';localStorage.rb_tcg_bar=h?'0':'1'}
addEventListener('keydown',e=>{if(e.key==='h'&&!/INPUT/.test(document.activeElement.tagName))hideBar(!$('bar').classList.contains('hide'))});
addEventListener('storage',e=>{if(e.key===K){const oc=S.c;load();draw({go:S.c!==oc})}else if(e.key==='rb_prod_tcg'||e.key==='rb_open_tcg')showInfo()});
function fit(){const z=Math.min(innerWidth/1920,innerHeight/1080);$('S').style.transform=`translate(${(innerWidth-1920*z)/2}px,${(innerHeight-1080*z)/2}px) scale(${z})`}
addEventListener('resize',fit);
if(QP.has('product'))localStorage.rb_prod_tcg=QP.get('product');if(QP.has('opening'))localStorage.rb_open_tcg=QP.get('opening');
localStorage.rb_lg='tcg';load();if(QP.get('controls')==='0'||localStorage.rb_tcg_bar==='0')hideBar(1);fit();showInfo();draw();if(document.fonts)document.fonts.ready.then(()=>drawHero());
</script></body></html>
