<!doctype html><html><head><meta charset="utf-8"><title>RIPAHOLICS Sold Wall</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@700;800;900&display=swap');
html,body{margin:0;background:transparent;overflow:hidden;font-family:Montserrat,Arial,sans-serif;color:#fff}
#S{position:absolute;left:0;top:0;transform-origin:0 0}.V #S{width:1080px;height:1920px}.H #S{width:1920px;height:1080px}
#A{position:absolute;transform-origin:var(--o)}
#U{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.row #U{flex-direction:row;text-align:left;gap:22px}
#U img{width:170px;height:170px;object-fit:contain;filter:drop-shadow(3px 0 0 #000) drop-shadow(-3px 0 0 #000) drop-shadow(0 3px 0 #000) drop-shadow(0 -3px 0 #000) drop-shadow(5px 8px 10px rgba(0,0,0,.75))}
.row #U img{width:120px;height:120px}
#U .ab{font-family:Anton;font-size:80px;-webkit-text-stroke:10px #000;paint-order:stroke fill}
.tx{display:flex;flex-direction:column;align-items:inherit}
#nm{font-family:Anton,Impact;font-size:72px;line-height:1.05;white-space:nowrap;-webkit-text-stroke:12px #000;paint-order:stroke fill;filter:drop-shadow(4px 7px 8px rgba(0,0,0,.8))}
#nm b{color:#f0189c;font-weight:400}
#tg{display:inline-block;font-size:34px;color:#0a96e8;margin-left:12px;vertical-align:.18em;-webkit-text-stroke:9px #000}
#tm{font-weight:900;font-size:26px;letter-spacing:6px;text-transform:uppercase;-webkit-text-stroke:7px #000;paint-order:stroke fill;filter:drop-shadow(3px 5px 6px rgba(0,0,0,.8))}
#U.in{animation:in .55s cubic-bezier(.25,1.3,.5,1) both}#U.out{animation:out .35s ease-in both}
#U.big{animation:big .9s cubic-bezier(.25,1.5,.5,1) both}
@keyframes in{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:translateY(-50px)}}
@keyframes big{0%{opacity:0;transform:scale(2.2);filter:brightness(3)}55%{opacity:1;transform:scale(.92);filter:brightness(1.6)}100%{transform:none;filter:none}}
#bar{position:fixed;left:0;right:0;bottom:0;background:#000d;padding:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font:700 13px Montserrat;z-index:9}
#bar input{font:700 14px Montserrat;padding:6px;border:2px solid #fff;background:#111;color:#fff;border-radius:4px}
#bar button{font:800 13px Montserrat;padding:7px 10px;border:2px solid #000;border-radius:4px;background:#fff;cursor:pointer}
#bar .p{background:#f0189c;color:#fff}.hide #bar{display:none}
</style></head><body><div id="S"><div id="A"><div id="U"></div></div></div>
<div id="bar"><input id="ti" placeholder="TEAM (e.g. NYY)" size="10"><input id="bi" placeholder="@buyer" size="14"><button class="p" onclick="sell()">+ Sell</button><button onclick="unsell()">Unsell</button><button id="cb" onclick="clr()">Clear</button>
<button onclick="cyPos()">Pos: <span id="pv"></span></button><button onclick="cyLay()">Layout: <span id="lv"></span></button><span id="lgv"></span><button onclick="hideBar()">Hide (H)</button></div>
<script>
const NM={mlb:{ARI:'Diamondbacks',ATL:'Braves',BAL:'Orioles',BOS:'Red Sox',CHC:'Cubs',CWS:'White Sox',CIN:'Reds',CLE:'Guardians',COL:'Rockies',DET:'Tigers',HOU:'Astros',KC:'Royals',LAA:'Angels',LAD:'Dodgers',MIA:'Marlins',MIL:'Brewers',MIN:'Twins',NYM:'Mets',NYY:'Yankees',ATH:'Athletics',PHI:'Phillies',PIT:'Pirates',SD:'Padres',SF:'Giants',SEA:'Mariners',STL:'Cardinals',TB:'Rays',TEX:'Rangers',TOR:'Blue Jays',WSH:'Nationals'},nfl:{ARI:'Cardinals',ATL:'Falcons',BAL:'Ravens',BUF:'Bills',CAR:'Panthers',CHI:'Bears',CIN:'Bengals',CLE:'Browns',DAL:'Cowboys',DEN:'Broncos',DET:'Lions',GB:'Packers',HOU:'Texans',IND:'Colts',JAX:'Jaguars',KC:'Chiefs',LV:'Raiders',LAC:'Chargers',LAR:'Rams',MIA:'Dolphins',MIN:'Vikings',NE:'Patriots',NO:'Saints',NYG:'Giants',NYJ:'Jets',PHI:'Eagles',PIT:'Steelers',SF:'49ers',SEA:'Seahawks',TB:'Buccaneers',TEN:'Titans',WSH:'Commanders'},nba:{ATL:'Hawks',BOS:'Celtics',BKN:'Nets',CHA:'Hornets',CHI:'Bulls',CLE:'Cavaliers',DAL:'Mavericks',DEN:'Nuggets',DET:'Pistons',GSW:'Warriors',HOU:'Rockets',IND:'Pacers',LAC:'Clippers',LAL:'Lakers',MEM:'Grizzlies',MIA:'Heat',MIL:'Bucks',MIN:'Timberwolves',NOP:'Pelicans',NYK:'Knicks',OKC:'Thunder',ORL:'Magic',PHI:'76ers',PHX:'Suns',POR:'Trail Blazers',SAC:'Kings',SAS:'Spurs',TOR:'Raptors',UTA:'Jazz',WAS:'Wizards'}};
const QP=new URLSearchParams(location.search);const $=i=>document.getElementById(i);
const LG=(QP.get('league')||localStorage.rb_lg||'mlb').toLowerCase();
const HOLD=Math.max(1,parseFloat(QP.get('hold'))||4)*1000;const SZ=Math.max(.3,parseFloat(QP.get('size'))||1);
let lay=(QP.get('layout')||localStorage.rb_wall_lay||'vertical').toLowerCase().startsWith('h')?'H':'V';
let pos=(QP.get('pos')||localStorage.rb_wall_pos2||'bottom').toLowerCase();if(!['bottom','top','left','right'].includes(pos))pos='bottom';
if(QP.get('controls')==='0'||localStorage.rb_wall_bar==='0')document.body.classList.add('hide');
const key=()=>'rb_'+LG;const esc=t=>String(t).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
const norm=n=>String(n||'').trim().replace(/^@+/,'').toLowerCase();
function load(){try{return JSON.parse(localStorage[key()]||'{}')}catch(e){return{}}}
let RS=null,L=[],seen=null,idx=-1,cur=null,tmr=null,last='';
function list(){const S=load(),out=Object.keys(S).map(a=>({a,n:String((S[a]||{}).n||'').trim().replace(/^@+/,'')}));const by={};out.forEach(x=>{const k=norm(x.n);(by[k]=by[k]||[]).push(x)});out.forEach(x=>{const g=by[norm(x.n)];x.i=g.indexOf(x)+1;x.n=g[0].n;x.m=norm(x.n)?g.length:1});return out}
function place(){const b=document.body;b.classList.remove('V','H');b.classList.add(lay);const A=$('A'),V=lay==='V';A.removeAttribute('style');A.className='';
const W=V?1080:1920,H=V?1920:1080;let s={};
if(pos==='bottom')s=V?{left:'0',width:'1080px',bottom:(1920-1135)+'px',o:'50% 100%'}:{left:'0',width:'1920px',bottom:'50px',o:'50% 100%'};
if(pos==='top'){s=V?{left:'0',width:'1080px',top:'14px',o:'50% 0'}:{left:'0',width:'1920px',top:'30px',o:'50% 0'};A.className='row'}
if(pos==='left')s={left:'40px',top:V?'600px':'300px',o:'0 0',al:'flex-start'};
if(pos==='right')s={right:'40px',top:V?'600px':'300px',o:'100% 0',al:'flex-end'};
Object.assign(A.style,{left:s.left||'',right:s.right||'',top:s.top||'',bottom:s.bottom||'',width:s.width||'',transform:'scale('+SZ+')'});A.style.setProperty('--o',s.o);
$('U').style.alignItems=s.al||'center';$('U').style.justifyContent=pos==='top'?'center':'';fit();$('pv').textContent=pos;$('lv').textContent=V?'vertical':'horizontal';$('lgv').textContent='league: '+LG}
function fit(){const V=lay==='V',s=Math.min(innerWidth/(V?1080:1920),innerHeight/(V?1920:1080));$('S').style.transform='scale('+s+')'}
function render(x,big){const U=$('U');const tn=((NM[LG]||{})[x.a])||x.a,sm=pos==='top'||pos==='left'||pos==='right';
U.innerHTML='<img src="logos/'+LG+'/'+x.a+'.png" onerror="this.outerHTML=\'<span class=ab>'+x.a+'</span>\'"><div class="tx"><div id="nm" style="font-size:'+Math.round((sm?60:72)*(x.n.length>16?16/x.n.length:1))+'px">'+(x.n?'<b>@</b>'+esc(x.n):'SOLD')+(x.m>1?'<span id="tg">'+x.i+'/'+x.m+'</span>':'')+'</div><div id="tm">'+esc(tn)+'</div></div>';
U.className='';void U.offsetWidth;U.className=big?'big':'in';cur=x.a}
function show(x,big){clearTimeout(tmr);const U=$('U');if(cur&&U.innerHTML){U.className='out';tmr=setTimeout(()=>{render(x,big);tmr=setTimeout(step,HOLD+(big?1500:0))},340)}else{render(x,big);tmr=setTimeout(step,HOLD+(big?1500:0))}}
function step(){L=list();if(!L.length){const U=$('U');U.className='out';cur=null;tmr=setTimeout(()=>{U.innerHTML=''},350);return}
const base=RS||cur;RS=null;let i=L.findIndex(x=>x.a===base);idx=(i<0?idx:i)+1;if(idx>=L.length)idx=0;if(L.length===1&&cur===L[0].a){tmr=setTimeout(step,HOLD);return}show(L[idx],false)}
function sync(){const raw=localStorage[key()]||'{}';if(raw===last)return;last=raw;const n=list(),ks=n.map(x=>x.a);
if(seen===null){seen=new Set(ks);L=n;if(n.length){idx=0;show(n[0],false)}return}
const fresh=n.filter(x=>!seen.has(x.a));seen=new Set(ks);L=n;
if(fresh.length){const x=fresh[fresh.length-1];RS=cur;show(x,true);return}
if(cur&&!ks.includes(cur))step();else if(!cur&&n.length)step();else if(cur){const x=n.find(y=>y.a===cur);x&&($('tg')||1)}}
function sell(){const a=$('ti').value.trim().toUpperCase();if(!a)return;const S=load();S[a]={n:$('bi').value.trim()};localStorage[key()]=JSON.stringify(S);$('ti').value='';sync()}
function unsell(){const a=$('ti').value.trim().toUpperCase();const S=load();delete S[a];localStorage[key()]=JSON.stringify(S);sync()}
let ct=0;function clr(){if(Date.now()-ct<2500){localStorage[key()]='{}';$('cb').textContent='Clear';sync()}else{ct=Date.now();$('cb').textContent='Tap again';setTimeout(()=>$('cb').textContent='Clear',2500)}}
function cyPos(){const o=['bottom','top','left','right'];pos=o[(o.indexOf(pos)+1)%4];localStorage.rb_wall_pos2=pos;place();const x=L.find(y=>y.a===cur);x&&render(x)}
function cyLay(){lay=lay==='V'?'H':'V';localStorage.rb_wall_lay=lay==='V'?'vertical':'horizontal';place()}
function hideBar(v){const h=v===undefined?!document.body.classList.contains('hide'):v;document.body.classList.toggle('hide',h);localStorage.rb_wall_bar=h?'0':'1'}
addEventListener('keydown',e=>{if(e.key.toLowerCase()==='h'&&!/INPUT/.test(document.activeElement.tagName))hideBar()});
addEventListener('storage',e=>{if(e.key===key())sync()});setInterval(sync,700);addEventListener('resize',fit);
place();sync();
</script></body></html>
