<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>RIPAHOLICS Sold Wall</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Chakra+Petch:wght@600;700&family=Montserrat:wght@700;800;900&family=Orbitron:wght@700;800;900&display=swap');
html,body{margin:0;background:transparent;overflow:hidden;font-family:Montserrat,Arial,sans-serif;color:#fff}
#S{position:absolute;left:0;top:0;transform-origin:0 0}
.V #S{width:1080px;height:1920px}
.H #S{width:1920px;height:1080px}

/* ---- Grid (bought-teams strip) ---- */
#strip{position:absolute;left:0;width:100%;box-sizing:border-box;background:rgba(6,6,10,.86);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 10px 28px rgba(0,0,0,.5);transform-origin:top center}
#strip.off{display:none}
#hd{font-family:'Chakra Petch','Orbitron',Montserrat,Arial,sans-serif;font-weight:700;font-size:54px;line-height:1;letter-spacing:-.03em;text-transform:uppercase;text-align:center;white-space:nowrap;overflow:hidden;padding:14px 20px 12px;border-bottom:1px solid rgba(255,255,255,.12);text-shadow:0 1px 0 #000,0 2px 10px rgba(0,0,0,.55)}
#hd:empty{display:none;padding:0;border:0}
#grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding-bottom:5px}
.cell{position:relative;display:flex;align-items:center;gap:8px;min-width:0;min-height:44px;padding:5px 10px 5px 8px;box-sizing:border-box;border-right:1px solid rgba(255,255,255,.09);border-top:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.02)}
.cell:nth-child(4n){border-right:none}
.cell:nth-child(8n+5),.cell:nth-child(8n+6),.cell:nth-child(8n+7),.cell:nth-child(8n+8){background:rgba(0,0,0,.16)}
.lo{flex:0 0 42px;width:42px;height:34px;display:grid;place-items:center}
.lo img{width:34px;height:34px;object-fit:contain;filter:drop-shadow(0 0 1.2px rgba(255,255,255,.7)) drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.lo img.dk{filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 7px rgba(255,255,255,.9)) drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.lo .ab{font-family:Anton,Impact,sans-serif;font-size:16px;letter-spacing:.5px;line-height:1}
.nm{flex:1;min-width:0;font-weight:800;font-size:20px;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.nm.anon{color:rgba(255,255,255,.48);font-weight:700;letter-spacing:.14em;font-size:16px}
.cell.open{opacity:.42}
.cell.open .nm{visibility:hidden}
.cell.fresh{z-index:2;animation:pop .7s cubic-bezier(.25,1.4,.5,1)}
.cell.fresh::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.42);animation:flash .65s ease-out forwards;pointer-events:none}
@keyframes pop{0%{transform:scale(1.05);filter:brightness(1.8)}100%{transform:none;filter:none}}
@keyframes flash{0%{opacity:1}100%{opacity:0}}

/* ---- Popup (classic rotating one-at-a-time) ---- */
#A{position:absolute;transform-origin:var(--o);display:none}
body.popup #A{display:block}
body.popup #strip{display:none}
#U{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.row #U{flex-direction:row;text-align:left;gap:22px}
#U img{width:170px;height:170px;object-fit:contain;filter:drop-shadow(3px 0 0 #000) drop-shadow(-3px 0 0 #000) drop-shadow(0 3px 0 #000) drop-shadow(0 -3px 0 #000) drop-shadow(5px 8px 10px rgba(0,0,0,.75))}
.row #U img{width:120px;height:120px}
#U .ab{font-family:Anton;font-size:80px;-webkit-text-stroke:10px #000;paint-order:stroke fill}
.tx{display:flex;flex-direction:column;align-items:inherit}
#nm{font-family:Anton,Impact;font-size:72px;line-height:1.05;white-space:nowrap;-webkit-text-stroke:12px #000;paint-order:stroke fill;filter:drop-shadow(4px 7px 8px rgba(0,0,0,.8))}
#nm b{color:#f0189c;font-weight:400}
#tg{display:inline-block;font-size:34px;color:#0a96e8;margin-left:12px;vertical-align:.18em;-webkit-text-stroke:9px #000}
#tm{font-weight:900;font-size:26px;letter-spacing:6px;text-transform:uppercase;-webkit-text-stroke:7px #000;paint-order:stroke fill;filter:drop-shadow(3px 5px 6px rgba(0,0,0,.8))}
#U.in{animation:in .55s cubic-bezier(.25,1.3,.5,1) both}
#U.out{animation:out .35s ease-in both}
#U.big{animation:big .9s cubic-bezier(.25,1.5,.5,1) both}
@keyframes in{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:translateY(-50px)}}
@keyframes big{0%{opacity:0;transform:scale(2.2);filter:brightness(3)}55%{opacity:1;transform:scale(.92);filter:brightness(1.6)}100%{transform:none;filter:none}}

/* ---- Controls ---- */
#bar{position:fixed;left:0;right:0;bottom:0;background:#000d;padding:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font:700 13px Montserrat;z-index:9}
#bar input{font:700 14px Montserrat;padding:6px;border:2px solid #fff;background:#111;color:#fff;border-radius:4px}
#bar button{font:800 13px Montserrat;padding:7px 10px;border:2px solid #000;border-radius:4px;background:#fff;cursor:pointer}
#bar .p{background:#f0189c;color:#fff}
#bar .hint{color:#9ad;font-weight:700;margin-left:4px}
.hide #bar{display:none}
</style>
</head>
<body>
<div id="S">
  <div id="strip" class="off">
    <div id="hd"></div>
    <div id="grid"></div>
  </div>
  <div id="A"><div id="U"></div></div>
</div>
<div id="bar">
  <input id="ti" placeholder="TEAM (e.g. NYY)" size="10">
  <input id="bi" placeholder="@buyer" size="14">
  <button class="p" onclick="sell()">+ Sell</button>
  <button onclick="unsell()">Unsell</button>
  <button id="cb" onclick="clr()">Clear</button>
  <button id="viewBtn" onclick="cyView()">View: <span id="vv"></span></button>
  <button id="showBtn" onclick="cyShow()">Show: <span id="sv"></span></button>
  <button id="posBtn" onclick="cyPos()">Pos: <span id="pv"></span></button>
  <button id="upBtn" onclick="nudgeBy(-20)">Up</button>
  <button id="dnBtn" onclick="nudgeBy(20)">Down</button>
  <button id="szm" onclick="sizeBy(-.08)">Size −</button>
  <button id="szp" onclick="sizeBy(.08)">Size +</button>
  <button id="opBtn" onclick="cyOp()">Op: <span id="ov"></span></button>
  <input id="titleIn" placeholder="Title (blank = auto)" size="22" oninput="setTitle(this.value)">
  <button id="hdBtn" onclick="cyHeader()">Title: <span id="hv"></span></button>
  <button id="layBtn" onclick="cyLay()">Layout: <span id="lv"></span></button>
  <span id="lgv"></span>
  <span class="hint" id="hint"></span>
  <button onclick="hideBar()">Hide (H)</button>
</div>
<script>
const TEAMS={
  mlb:['ARI','ATL','BAL','BOS','CHC','CWS','CIN','CLE','COL','DET','HOU','KC','LAA','LAD','MIA','MIL','MIN','NYM','NYY','ATH','PHI','PIT','SD','SF','SEA','STL','TB','TEX','TOR','WSH'],
  nfl:['ARI','ATL','BAL','BUF','CAR','CHI','CIN','CLE','DAL','DEN','DET','GB','HOU','IND','JAX','KC','LV','LAC','LAR','MIA','MIN','NE','NO','NYG','NYJ','PHI','PIT','SF','SEA','TB','TEN','WSH'],
  nba:['ATL','BOS','BKN','CHA','CHI','CLE','DAL','DEN','DET','GSW','HOU','IND','LAC','LAL','MEM','MIA','MIL','MIN','NOP','NYK','OKC','ORL','PHI','PHX','POR','SAC','SAS','TOR','UTA','WAS']
};
const COLLEGE=['SEC','BIG10','BIG12','ACC','OTHER'];
const NM={mlb:{ARI:'Diamondbacks',ATL:'Braves',BAL:'Orioles',BOS:'Red Sox',CHC:'Cubs',CWS:'White Sox',CIN:'Reds',CLE:'Guardians',COL:'Rockies',DET:'Tigers',HOU:'Astros',KC:'Royals',LAA:'Angels',LAD:'Dodgers',MIA:'Marlins',MIL:'Brewers',MIN:'Twins',NYM:'Mets',NYY:'Yankees',ATH:'Athletics',PHI:'Phillies',PIT:'Pirates',SD:'Padres',SF:'Giants',SEA:'Mariners',STL:'Cardinals',TB:'Rays',TEX:'Rangers',TOR:'Blue Jays',WSH:'Nationals'},nfl:{ARI:'Cardinals',ATL:'Falcons',BAL:'Ravens',BUF:'Bills',CAR:'Panthers',CHI:'Bears',CIN:'Bengals',CLE:'Browns',DAL:'Cowboys',DEN:'Broncos',DET:'Lions',GB:'Packers',HOU:'Texans',IND:'Colts',JAX:'Jaguars',KC:'Chiefs',LV:'Raiders',LAC:'Chargers',LAR:'Rams',MIA:'Dolphins',MIN:'Vikings',NE:'Patriots',NO:'Saints',NYG:'Giants',NYJ:'Jets',PHI:'Eagles',PIT:'Steelers',SF:'49ers',SEA:'Seahawks',TB:'Buccaneers',TEN:'Titans',WSH:'Commanders',SEC:'SEC',BIG10:'Big Ten',BIG12:'Big 12',ACC:'ACC',OTHER:'Other College'},nba:{ATL:'Hawks',BOS:'Celtics',BKN:'Nets',CHA:'Hornets',CHI:'Bulls',CLE:'Cavaliers',DAL:'Mavericks',DEN:'Nuggets',DET:'Pistons',GSW:'Warriors',HOU:'Rockets',IND:'Pacers',LAC:'Clippers',LAL:'Lakers',MEM:'Grizzlies',MIA:'Heat',MIL:'Bucks',MIN:'Timberwolves',NOP:'Pelicans',NYK:'Knicks',OKC:'Thunder',ORL:'Magic',PHI:'76ers',PHX:'Suns',POR:'Trail Blazers',SAC:'Kings',SAS:'Spurs',TOR:'Raptors',UTA:'Jazz',WAS:'Wizards'}};

const QP=new URLSearchParams(location.search);
const $=i=>document.getElementById(i);
const PIN=QP.has('league');
const HOLD=Math.max(1,parseFloat(QP.get('hold'))||4)*1000;
const esc=t=>String(t).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
let dark={};

function validLg(v){v=String(v||'').toLowerCase();return TEAMS[v]?v:'mlb'}
function readLg(){return PIN?validLg(QP.get('league')):validLg(localStorage.rb_lg||'mlb')}
let LG=readLg();
let lay=(QP.get('layout')||localStorage.rb_wall_lay||'vertical').toLowerCase().startsWith('h')?'H':'V';
let mode=(QP.get('mode')||localStorage.rb_wall_mode||'grid').toLowerCase();if(mode!=='popup')mode='grid';
let show=(QP.get('show')||localStorage.rb_wall_show||'sold').toLowerCase();if(show!=='all')show='sold';
let pos=(QP.get('pos')||localStorage.rb_wall_pos3||'middle').toLowerCase();if(!['middle','top','bottom'].includes(pos))pos='middle';
let nudge=parseInt(QP.get('y')!=null?QP.get('y'):(localStorage.rb_wall_y||'0'),10)||0;
let SZ=Math.max(.5,Math.min(1.5,parseFloat(QP.get('size')!=null?QP.get('size'):(localStorage.rb_wall_sz||'1'))||1));
let opac=Math.max(.55,Math.min(1,parseFloat(localStorage.rb_wall_op||'1')||1));
let customTitle=QP.get('title')!=null?QP.get('title'):(localStorage.rb_wall_title||'');
let titleOn=!(QP.get('header')==='0'||(QP.get('header')==null&&localStorage.rb_wall_th==='0'));
if(QP.get('controls')==='0'||localStorage.rb_wall_bar==='0')document.body.classList.add('hide');

const key=()=>'rb_'+LG;
function load(){try{return JSON.parse(localStorage[key()]||'{}')}catch(e){return{}}}
function persist(){
  localStorage.rb_wall_mode=mode;
  localStorage.rb_wall_show=show;
  localStorage.rb_wall_pos3=pos;
  localStorage.rb_wall_y=String(nudge);
  localStorage.rb_wall_sz=String(SZ);
  localStorage.rb_wall_op=String(opac);
  localStorage.rb_wall_lay=lay==='V'?'vertical':'horizontal';
  localStorage.rb_wall_title=customTitle;
  localStorage.rb_wall_th=titleOn?'1':'0';
}

function collegeOn(){return LG==='nfl'&&(localStorage.rb_extra_nfl||'')==='college'}
function roster(){
  const r=(TEAMS[LG]||[]).slice(),S=load();
  if(LG==='nfl')COLLEGE.forEach(a=>{if(collegeOn()||S[a])r.push(a)});
  return r;
}
function cleanName(n){return String(n||'').trim().replace(/^@+/,'')}
function soldList(){
  const S=load();
  return Object.keys(S).map(a=>({a,n:cleanName((S[a]||{}).n)}));
}

function autoTitle(){
  const bn=String(localStorage.rb_bn||'').trim().replace(/^#/,'');
  const pd=String(localStorage['rb_prod_'+LG]||'').trim();
  const op=String(localStorage['rb_open_'+LG]||'').trim();
  const parts=[];
  if(bn)parts.push('#'+bn);
  if(pd)parts.push(pd);
  if(op)parts.push(op);
  return parts.join(' ');
}
function headerText(){
  if(!titleOn)return '';
  const c=String(customTitle||'').trim();
  return c||autoTitle();
}

function plate(img,a){
  if(a in dark){if(dark[a])img.classList.add('dk');return}
  try{
    const c=document.createElement('canvas');c.width=c.height=32;
    const x=c.getContext('2d');x.drawImage(img,0,0,32,32);
    const d=x.getImageData(0,0,32,32).data;let s=0,n=0;
    for(let i=0;i<d.length;i+=4)if(d[i+3]>128){s+=.2126*d[i]+.7152*d[i+1]+.0722*d[i+2];n++}
    dark[a]=n?s/n<150:false;
  }catch(e){dark[a]=true}
  if(dark[a])img.classList.add('dk');
}

function nameStyle(n){
  const L=n.length;
  if(L<=6)return '22px';
  if(L<=9)return '20px';
  if(L<=12)return '17px';
  if(L<=16)return '14px';
  return '12px';
}

function cells(){
  const S=load();
  if(show==='all'){
    return roster().map(a=>({a,sold:!!S[a],n:S[a]?cleanName(S[a].n):''}));
  }
  return soldList().map(x=>({a:x.a,sold:true,n:x.n}));
}

let seen=null,lastFp='',popL=[],popSeen=null,popIdx=-1,popCur=null,popTmr=null,popRS=null,popLast='';

function fingerprint(){
  return [readLg(),localStorage.rb_lg,localStorage[key()],localStorage.rb_bn,localStorage['rb_prod_'+LG],localStorage['rb_open_'+LG],localStorage['rb_extra_'+LG],headerText()].join('\x1f');
}

function fitTitle(){
  const hd=$('hd');if(!hd||!hd.textContent)return;
  const max=lay==='V'?56:68,min=20,avail=hd.clientWidth|| (lay==='V'?1040:1880);
  let lo=min,hi=max,best=min;
  for(let i=0;i<18;i++){
    const mid=(lo+hi)/2;
    hd.style.fontSize=mid+'px';
    if(hd.scrollWidth<=avail){best=mid;lo=mid}else hi=mid;
  }
  hd.style.fontSize=Math.floor(best)+'px';
}

function paintBar(){
  $('vv').textContent=mode==='popup'?'Pop-up':'Grid';
  $('sv').textContent=show==='all'?'All teams':'Sold only';
  $('pv').textContent=pos;
  $('ov').textContent=Math.round(opac*100)+'%';
  $('hv').textContent=titleOn?'ON':'OFF';
  $('lv').textContent=lay==='V'?'vertical':'horizontal';
  $('lgv').textContent='league: '+LG;
  const n=soldList().length;
  $('hint').textContent=(mode==='grid'&&show==='sold'&&n===0)?'0 teams sold — mark sold on the team board':'';
  $('showBtn').style.display=mode==='popup'?'none':'';
  if($('titleIn')!==document.activeElement)$('titleIn').value=customTitle;
}

function fit(){
  const W=lay==='V'?1080:1920,H=lay==='V'?1920:1080;
  const s=Math.min(innerWidth/W,innerHeight/H);
  $('S').style.transform='scale('+s+')';
}

function place(){
  document.body.classList.toggle('V',lay==='V');
  document.body.classList.toggle('H',lay==='H');
  document.body.classList.toggle('popup',mode==='popup');
  const V=lay==='V',W=V?1080:1920,H=V?1920:1080;
  const strip=$('strip'),A=$('A');
  const origin=pos==='bottom'?'bottom center':'top center';
  strip.style.transformOrigin=origin;
  strip.style.opacity=String(opac);
  let top='',bottom='';
  if(pos==='top')top=(18+nudge)+'px';
  else if(pos==='middle')top=(Math.round(H*0.32)+nudge)+'px';
  else bottom=(48-nudge)+'px';
  Object.assign(strip.style,{top,bottom,transform:'scale('+SZ+')'});

  A.removeAttribute('style');A.className='';
  let s={};
  if(pos==='bottom')s=V?{left:'0',width:'1080px',bottom:(80-nudge)+'px',o:'50% 100%'}:{left:'0',width:'1920px',bottom:(50-nudge)+'px',o:'50% 100%'};
  else if(pos==='top'){s=V?{left:'0',width:'1080px',top:(14+nudge)+'px',o:'50% 0'}:{left:'0',width:'1920px',top:(30+nudge)+'px',o:'50% 0'};A.className='row'}
  else s=V?{left:'0',width:'1080px',top:(Math.round(H*0.38)+nudge)+'px',o:'50% 0'}:{left:'0',width:'1920px',top:(Math.round(H*0.36)+nudge)+'px',o:'50% 0'};
  Object.assign(A.style,{left:s.left||'',right:s.right||'',top:s.top||'',bottom:s.bottom||'',width:s.width||'',transform:'scale('+SZ+')'});
  A.style.setProperty('--o',s.o);
  $('U').style.alignItems='center';
  $('U').style.justifyContent='center';
  fit();
  paintBar();
}

function drawGrid(fresh){
  const list=cells();
  const hd=$('hd'),grid=$('grid'),strip=$('strip');
  const empty=show==='sold'&&list.length===0;
  strip.classList.toggle('off',empty);
  hd.textContent=empty?'':headerText();
  hd.style.fontSize='';
  grid.innerHTML='';
  if(empty){place();return}
  list.forEach(x=>{
    const d=document.createElement('div');
    d.className='cell'+(x.sold?'':' open')+(fresh&&fresh.has(x.a)?' fresh':'');
    d.dataset.team=x.a;
    const name=x.sold?(x.n?x.n.toUpperCase():'SOLD'):'';
    const nmClass=x.sold&&!x.n?'nm anon':'nm';
    d.innerHTML='<div class="lo"><img alt="" src="logos/'+LG+'/'+x.a+'.png" data-a="'+esc(x.a)+'"></div><div class="'+nmClass+'" style="font-size:'+nameStyle(name)+'">'+(x.sold?esc(name):'')+'</div>';
    const img=d.querySelector('img');
    img.onload=function(){plate(this,x.a)};
    img.onerror=function(){this.parentNode.innerHTML='<span class="ab">'+esc(x.a)+'</span>'};
    grid.appendChild(d);
  });
  place();
  fitTitle();
}

function popList(){
  const S=load(),out=Object.keys(S).map(a=>({a,n:cleanName((S[a]||{}).n)}));
  const by={};out.forEach(x=>{const k=x.n.toLowerCase();(by[k]=by[k]||[]).push(x)});
  out.forEach(x=>{const g=by[x.n.toLowerCase()];x.i=g.indexOf(x)+1;x.n=g[0].n;x.m=x.n?g.length:1});
  return out;
}
function popRender(x,big){
  const U=$('U');const tn=((NM[LG]||{})[x.a])||x.a,sm=pos==='top';
  U.innerHTML='<img src="logos/'+LG+'/'+x.a+'.png" onerror="this.outerHTML=\'<span class=ab>'+esc(x.a)+'</span>\'"><div class="tx"><div id="nm" style="font-size:'+Math.round((sm?60:72)*(x.n.length>16?16/x.n.length:1))+'px">'+(x.n?'<b>@</b>'+esc(x.n):'SOLD')+(x.m>1?'<span id="tg">'+x.i+'/'+x.m+'</span>':'')+'</div><div id="tm">'+esc(tn)+'</div></div>';
  U.className='';void U.offsetWidth;U.className=big?'big':'in';popCur=x.a;
}
function popShow(x,big){
  clearTimeout(popTmr);const U=$('U');
  if(popCur&&U.innerHTML){U.className='out';popTmr=setTimeout(()=>{popRender(x,big);popTmr=setTimeout(popStep,HOLD+(big?1500:0))},340)}
  else{popRender(x,big);popTmr=setTimeout(popStep,HOLD+(big?1500:0))}
}
function popStep(){
  popL=popList();
  if(!popL.length){const U=$('U');U.className='out';popCur=null;popTmr=setTimeout(()=>{U.innerHTML=''},350);return}
  const base=popRS||popCur;popRS=null;
  let i=popL.findIndex(x=>x.a===base);popIdx=(i<0?popIdx:i)+1;if(popIdx>=popL.length)popIdx=0;
  if(popL.length===1&&popCur===popL[0].a){popTmr=setTimeout(popStep,HOLD);return}
  popShow(popL[popIdx],false);
}
function popSync(){
  const raw=localStorage[key()]||'{}';
  if(raw===popLast)return;
  popLast=raw;
  const n=popList(),ks=n.map(x=>x.a);
  if(popSeen===null){popSeen=new Set(ks);popL=n;if(n.length){popIdx=0;popShow(n[0],false)}return}
  const fresh=n.filter(x=>!popSeen.has(x.a));
  popSeen=new Set(ks);popL=n;
  if(fresh.length){const x=fresh[fresh.length-1];popRS=popCur;popShow(x,true);return}
  if(popCur&&!ks.includes(popCur))popStep();
  else if(!popCur&&n.length)popStep();
}
function popStop(){clearTimeout(popTmr);popTmr=null}

function sync(force){
  const lgNow=readLg();
  if(lgNow!==LG){
    LG=lgNow;seen=null;lastFp='';popSeen=null;popLast='';popCur=null;popIdx=-1;dark={};
    $('U').innerHTML='';
  }
  const fp=fingerprint();
  if(!force&&fp===lastFp&&mode==='grid')return;
  lastFp=fp;
  if(mode==='popup'){place();popSync();paintBar();return}
  popStop();
  const ks=soldList().map(x=>x.a);
  let fresh=null;
  if(seen===null){seen=new Set(ks)}
  else{
    const neu=ks.filter(a=>!seen.has(a));
    seen=new Set(ks);
    if(neu.length)fresh=new Set(neu);
  }
  drawGrid(fresh);
}

function sell(){
  const a=$('ti').value.trim().toUpperCase();if(!a)return;
  const S=load();S[a]={n:$('bi').value.trim()};localStorage[key()]=JSON.stringify(S);
  $('ti').value='';sync(true);
}
function unsell(){
  const a=$('ti').value.trim().toUpperCase();const S=load();delete S[a];localStorage[key()]=JSON.stringify(S);sync(true);
}
let ct=0;
function clr(){
  if(Date.now()-ct<2500){localStorage[key()]='{}';$('cb').textContent='Clear';sync(true)}
  else{ct=Date.now();$('cb').textContent='Tap again';setTimeout(()=>$('cb').textContent='Clear',2500)}
}
function cyView(){mode=mode==='grid'?'popup':'grid';if(mode==='grid'){popStop();popSeen=null;popLast='';seen=null}persist();sync(true);place()}
function cyShow(){show=show==='sold'?'all':'sold';persist();seen=null;sync(true)}
function cyPos(){const o=['middle','top','bottom'];pos=o[(o.indexOf(pos)+1)%3];persist();place()}
function nudgeBy(d){nudge+=d;persist();place()}
function sizeBy(d){SZ=Math.max(.5,Math.min(1.5,Math.round((SZ+d)*100)/100));persist();place();fitTitle()}
function cyOp(){const o=[1,.85,.7];const i=o.findIndex(v=>Math.abs(v-opac)<.02);opac=o[(i+1)%3];persist();place()}
function setTitle(v){customTitle=v;persist();if(mode==='grid'){const empty=show==='sold'&&!soldList().length;if(!empty){$('hd').textContent=headerText();fitTitle()}}paintBar()}
function cyHeader(){titleOn=!titleOn;persist();if(mode==='grid'){const empty=show==='sold'&&!soldList().length;if(!empty){$('hd').textContent=headerText();fitTitle()}}paintBar()}
function cyLay(){lay=lay==='V'?'H':'V';persist();place();if(mode==='grid')fitTitle()}
function hideBar(v){const h=v===undefined?!document.body.classList.contains('hide'):v;document.body.classList.toggle('hide',h);localStorage.rb_wall_bar=h?'0':'1'}

addEventListener('keydown',e=>{if(e.key.toLowerCase()==='h'&&!/INPUT/.test(document.activeElement.tagName))hideBar()});
addEventListener('storage',e=>{
  if(!e.key)return;
  if(e.key===key()||e.key==='rb_lg'||e.key==='rb_bn'||e.key.startsWith('rb_prod_')||e.key.startsWith('rb_open_')||e.key.startsWith('rb_extra_'))sync(true);
});
setInterval(()=>sync(false),700);
addEventListener('resize',()=>{fit();if(mode==='grid')fitTitle()});
place();
const ready=document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve();
ready.then(()=>sync(true));
sync(true);
</script>
</body>
</html>
