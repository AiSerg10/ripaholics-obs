<div id="wrap"><div id="hd" style="display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center"><div id="bn" title="Click to edit break #" onclick="editBn()"></div><span id="ttl"><img src="rb-logo-crown.png" alt="RIPAHOLICS">PYT</span><div id="now"></div></div>

<button style="background:#f0189c;color:#fff" onclick="mark(true)">SOLD</button> <button onclick="mark(false)">Undo</button> <button onclick="closeP()">Cancel</button></div></div>

async function loadChase(){const sl=localStorage['rb_cset_'+lg]||'';document.getElementById('chs').value=sl;if(sl===CH_SLUG&&CH_DATA)return peekCheck();CH_SLUG=sl;CH_DATA=null;hidePeek();if(!sl){if(CH_X){CH_X='';draw()}return}try{const r=await fetch('chase/'+encodeURIComponent(sl)+'.json?t='+Date.now());if(!r.ok)throw 0;const d=await r.json();if(CH_SLUG===sl){CH_DATA=d;if((d.extra||'')!==CH_X){CH_X=d.extra||'';draw()}showPeek()}}catch(e){CH_DATA=null}}
async function loadIdx(){try{CH_IDX=await (await fetch('chase/index.json?t='+Date.now())).json()}catch(e){CH_IDX=[]}fillChs()}
function fillChs(){const e=document.getElementById('chs'),cur=localStorage['rb_cset_'+lg]||'';e.innerHTML='<option value="">Chase set: none</option>'+CH_IDX.filter(x=>!x.league||x.league===lg).map(x=>`<option value="${esc(x.slug)}">${esc(x.name)}</option>`).join('');if(cur&&![...e.options].some(o=>o.value===cur))e.insertAdjacentHTML('beforeend',`<option value="${esc(cur)}">${esc(cur)}</option>`);e.value=cur;document.getElementById('fms').value=localStorage['rb_fmt_'+lg]||'auto'}
function showTg(){const a=document.getElementById('spb'),b=document.getElementById('chb');a.textContent='Spotlight: '+(spotOn()?'ON':'OFF');a.classList.toggle('on',spotOn());b.textContent='Chase: '+(chOn()?'ON':'OFF');b.classList.toggle('on',chOn())}
function setSpot(v){localStorage.rb_spot=v?'1':'0';showTg();v?stepSpot():applySpot()}
function setCh(v){localStorage.rb_chase=v?'1':'0';showTg();v?showPeek():hidePeek()}
function setCs(v){localStorage['rb_cset_'+lg]=v;loadChase()}
