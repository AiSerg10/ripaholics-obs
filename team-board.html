<!DOCTYPE html><html><head><meta charset="utf-8"><title>RIPAHOLICS Board</title><style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@700;800;900&display=swap');
html,body{margin:0;background:transparent;user-select:none}
#wrap{display:inline-block;position:relative;overflow:hidden;padding:12px 14px 12px;border-radius:14px;background:#000 url('rb-inksmoke-bg.jpg') center/cover no-repeat;border:4px solid #000;box-shadow:0 0 0 2px #fff,0 6px 16px rgba(0,0,0,.8)}
#wrap::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.45);pointer-events:none}
#hd,#board,#bar{position:relative;z-index:1}
#hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding:0 4px}
#ttl{display:flex;align-items:center;gap:12px;font-family:Anton,Impact,sans-serif;font-size:40px;color:#fff;letter-spacing:3px;-webkit-text-stroke:2px #000;paint-order:stroke fill;text-shadow:3px 3px 0 #000}
#ttl img{height:58px;filter:drop-shadow(2px 0 0 #000) drop-shadow(-2px 0 0 #000) drop-shadow(0 2px 0 #000) drop-shadow(0 -2px 0 #000)}
#cnt,#bn{font-family:Montserrat,Arial,sans-serif;font-weight:900;font-size:18px;border:3px solid #000;padding:4px 14px;border-radius:20px}
#cnt{color:#fff;background:#f0189c}
#bn{justify-self:start;cursor:pointer;color:#000;background:#fff}
#board{display:grid;gap:7px}
#board.div{display:flex;gap:10px;align-items:flex-start}
.dv{display:flex;flex-direction:column;gap:6px;align-items:center}
.dh{font-family:Montserrat,Arial,sans-serif;font-weight:900;font-size:12px;letter-spacing:.5px;color:#000;background:#fff;padding:2px 8px;border-radius:6px;border:2px solid #000;white-space:nowrap}
.dv.nl .dh,.dv.nfc .dh{background:#f0189c;color:#fff}
.t{width:80px;height:64px;border-radius:10px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;border:3px solid #000;box-shadow:0 0 0 1.5px rgba(255,255,255,.85),0 3px 0 #000;transition:transform .15s}
.t::before{content:"";position:absolute;inset:0;background:linear-gradient(170deg,rgba(255,255,255,.22),rgba(255,255,255,0) 42%);pointer-events:none;z-index:1}
.t:hover{transform:scale(1.06)}
.bg{position:absolute;inset:0;z-index:0}
.ab{font-family:Anton,Impact,sans-serif;font-size:27px;letter-spacing:1px;color:#fff;-webkit-text-stroke:2px #000;paint-order:stroke fill;text-shadow:2px 2px 0 #000;z-index:1}
.nm{font-family:Montserrat,Arial,sans-serif;font-weight:800;font-size:10px;color:#fff;z-index:3;max-width:76px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#000;border:1px solid #f0189c;padding:1px 4px;border-radius:4px;margin-top:2px}
.sold{box-shadow:0 0 0 1.5px #f0189c,0 3px 0 #000}
.sold .ab{opacity:.3}
.sold .bg{filter:grayscale(1) brightness(.3)}
.sold::after{content:"";position:absolute;left:-10px;right:-10px;top:44%;height:7px;background:#f0189c;box-shadow:0 0 0 2px #000;transform:rotate(-30deg);z-index:2;animation:slash .35s ease-out}
@keyframes slash{from{transform:rotate(-30deg) scaleX(0)}to{transform:rotate(-30deg) scaleX(1)}}
#bar{display:flex;flex-wrap:wrap;width:0;min-width:100%;gap:6px;margin-top:8px;opacity:.12;font-family:Arial}#bar:hover{opacity:1}
#bar button{font-family:Montserrat,Arial;font-weight:800;font-size:11px;padding:4px 10px;border:2px solid #000;border-radius:6px;background:#fff;color:#000;cursor:pointer}
#pop{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.7)}
#pop>div{background:#0b0b0f;padding:14px 16px;border:3px solid #fff;border-radius:10px;color:#fff;font-family:Montserrat,Arial;font-weight:800}
#pop input{font-size:16px;padding:6px;width:200px;border-radius:6px;border:2px solid #000;margin:8px 0}
#pop button{font-family:Montserrat,Arial;font-weight:800;padding:5px 10px;border:2px solid #000;border-radius:6px;cursor:pointer}
#st,#stage{position:relative;z-index:1}
#st{display:flex;justify-content:center;align-items:center;gap:10px;margin:-2px 0 10px}
#left{font-family:Anton,Impact,sans-serif;font-size:24px;letter-spacing:2px;color:#fff;background:#000;border:3px solid #fff;outline:3px solid #000;padding:2px 16px;border-radius:8px}
#left b{color:#0a96e8;font-weight:400}
#fin{display:none;flex:1;text-align:center;font-family:Anton,Impact,sans-serif;font-size:62px;line-height:1.05;letter-spacing:5px;color:#fff;background:#0b0b0f;border:4px solid #000;box-shadow:0 0 0 3px #fff,0 7px 0 #000,0 10px 18px rgba(0,0,0,.85);padding:4px 22px 6px;border-radius:12px;-webkit-text-stroke:3px #000;paint-order:stroke fill;text-shadow:4px 4px 0 #000}
#fin .in span{color:#f0189c}#fin .in{color:#fff;display:inline-block;animation:pl 1.4s ease-in-out infinite}
#fin.pop .in{animation:pop .45s cubic-bezier(.2,1.6,.4,1),pl 1.4s ease-in-out .45s infinite}
@keyframes pop{0%{transform:scale(.55)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
#board{transition:opacity .6s,transform .6s}
#fill{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:16px;opacity:0;pointer-events:none;transform:scale(.97);transition:opacity .7s .15s,transform .7s .15s;overflow:hidden}
.full #board{opacity:0;transform:scale(.97)}.full #fill{opacity:1;transform:none;pointer-events:auto}.full #st{display:none}
#fh{text-align:center;font-family:Anton,Impact,sans-serif;font-size:64px;letter-spacing:6px;color:#fff;-webkit-text-stroke:3px #000;paint-order:stroke fill;text-shadow:4px 4px 0 #000;line-height:1}
#fh i{font-style:normal;color:#f0189c}
#mq{overflow:hidden;border-top:3px solid #000;border-bottom:3px solid #000;background:rgba(0,0,0,.55);padding:12px 0}
#trk{display:flex;width:max-content;animation:mq var(--d,40s) linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
.mc{display:flex;align-items:center;gap:10px;margin-right:14px;background:#0b0b0f;border:3px solid #000;box-shadow:0 0 0 2px #fff;border-radius:10px;padding:6px 14px 6px 6px}
.mc .lg{width:70px;height:54px;border-radius:8px;border:3px solid #000;display:flex;align-items:center;justify-content:center;font-family:Anton,Impact,sans-serif;font-size:26px;color:#fff;-webkit-text-stroke:2px #000;paint-order:stroke fill}
.mc .bn{font-family:Montserrat,Arial,sans-serif;font-weight:900;font-size:22px;color:#fff;white-space:nowrap}
.mc .bn small{display:block;font-size:11px;letter-spacing:1px;color:#f0189c}
#bar input{font-family:Montserrat,Arial;font-weight:800;font-size:11px;padding:3px 6px;border:2px solid #000;border-radius:6px;width:70px}#bar input#nxi{width:150px}
#fnx{display:none;align-self:center;font-family:Montserrat,Arial,sans-serif;font-weight:900;font-size:18px;color:#fff;background:#0b0b0f;border:2px solid #000;box-shadow:0 0 0 1.5px #fff;border-radius:6px;padding:3px 14px;-webkit-text-stroke:0}#fnx b{color:#f0189c;letter-spacing:2px;margin-right:6px}
#now{justify-self:end;display:none;text-align:right;background:#0b0b0f;border:3px solid #000;box-shadow:0 0 0 2px #fff,0 3px 0 #000;border-radius:8px;padding:3px 10px 4px;max-width:100%;box-sizing:border-box;min-width:0;font-family:Montserrat,Arial,sans-serif;font-weight:900;color:#fff;line-height:1.1}
#now small{display:block;font-size:9px;letter-spacing:2px;color:#f0189c}
#now .pr{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:17px;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#now .op{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body>
<div id="wrap"><div id="hd" style="display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center"><div id="bn" title="Click to edit break #" onclick="editBn()"></div><span id="ttl"><img src="rb-logo-crown.png" alt="RIPAHOLICS">PYT</span><div id="now"></div></div>
<div id="st"><div id="left"></div><div id="fin"></div></div>
<div id="stage" style="position:relative"><div id="board"></div><div id="fill"><div id="fh">BREAK <i>FILLED</i></div><div id="mq"><div id="trk"></div></div><div id="fnx"></div></div></div>
<div id="bar"><button onclick="setL('mlb')">MLB</button><button onclick="setL('nfl')">NFL</button><button onclick="setL('nba')">NBA</button><button onclick="bnStep(-1)">Break &minus;</button><button onclick="bnStep(1)">Break +</button><input id="pdi" placeholder="Product" oninput="setInfo()"><input id="opi" placeholder="Opening" oninput="setInfo()"><input id="nxi" placeholder="Next break" oninput="setInfo()"><button id="rst" onclick="resetB(this)">Reset</button></div></div>
<div id="pop"><div><div id="pt"></div><input id="pi" placeholder="Buyer name"><br>
<button style="background:#f0189c;color:#fff" onclick="mark(true)">SOLD</button> <button onclick="mark(false)">Undo</button> <button onclick="closeP()">Cancel</button></div></div>
<script>
const L={
mlb:[["ARI","#A71930"],["ATL","#CE1141"],["BAL","#DF4601"],["BOS","#BD3039"],["CHC","#0E3386"],["CWS","#27251F"],["CIN","#C6011F"],["CLE","#00385D"],["COL","#33006F"],["DET","#0C2340"],["HOU","#EB6E1F"],["KC","#004687"],["LAA","#BA0021"],["LAD","#005A9C"],["MIA","#00A3E0"],["MIL","#12284B"],["MIN","#002B5C"],["NYM","#FF5910"],["NYY","#0C2340"],["ATH","#003831"],["PHI","#E81828"],["PIT","#FDB827"],["SD","#2F241D"],["SF","#FD5A1E"],["SEA","#005C5C"],["STL","#C41E3A"],["TB","#092C5C"],["TEX","#003278"],["TOR","#134A8E"],["WSH","#AB0003"]],
nfl:[["ARI","#97233F"],["ATL","#A71930"],["BAL","#241773"],["BUF","#00338D"],["CAR","#0085CA"],["CHI","#0B162A"],["CIN","#FB4F14"],["CLE","#311D00"],["DAL","#003594"],["DEN","#FB4F14"],["DET","#0076B6"],["GB","#203731"],["HOU","#03202F"],["IND","#002C5F"],["JAX","#006778"],["KC","#E31837"],["LV","#000000"],["LAC","#0080C6"],["LAR","#003594"],["MIA","#008E97"],["MIN","#4F2683"],["NE","#002244"],["NO","#D3BC8D"],["NYG","#0B2265"],["NYJ","#125740"],["PHI","#004C54"],["PIT","#FFB612"],["SF","#AA0000"],["SEA","#002244"],["TB","#D50A0A"],["TEN","#4B92DB"],["WSH","#5A1414"]],
nba:[["ATL","#E03A3E"],["BOS","#007A33"],["BKN","#000000"],["CHA","#1D1160"],["CHI","#CE1141"],["CLE","#860038"],["DAL","#00538C"],["DEN","#0E2240"],["DET","#C8102E"],["GSW","#1D428A"],["HOU","#CE1141"],["IND","#002D62"],["LAC","#C8102E"],["LAL","#552583"],["MEM","#5D76A9"],["MIA","#98002E"],["MIL","#00471B"],["MIN","#0C2340"],["NOP","#0C2340"],["NYK","#F58426"],["OKC","#007AC1"],["ORL","#0077C0"],["PHI","#006BB6"],["PHX","#1D1160"],["POR","#E03A3E"],["SAC","#5A2D81"],["SAS","#000000"],["TOR","#CE1141"],["UTA","#002B5C"],["WAS","#002B5C"]]};
const QP=new URLSearchParams(location.search);const esc=t=>String(t).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
let lg=(QP.get('league')||'').toLowerCase()||localStorage.rb_lg||'mlb',S={},cur=null;
function key(){return 'rb_'+lg}
function load(){S=JSON.parse(localStorage[key()]||'{}')}
function save(){localStorage[key()]=JSON.stringify(S)}
function setL(l){lg=l;localStorage.rb_lg=l;load();draw();showInfo()}
const D={mlb:[["AL EAST",["BAL","BOS","NYY","TB","TOR"],"al"],["AL CENTRAL",["CWS","CLE","DET","KC","MIN"],"al"],["AL WEST",["ATH","HOU","LAA","SEA","TEX"],"al"],["NL EAST",["ATL","MIA","NYM","PHI","WSH"],"nl"],["NL CENTRAL",["CHC","CIN","MIL","PIT","STL"],"nl"],["NL WEST",["ARI","COL","LAD","SD","SF"],"nl"]],
nfl:[["AFC EAST",["BUF","MIA","NE","NYJ"],"afc"],["AFC NORTH",["BAL","CIN","CLE","PIT"],"afc"],["AFC SOUTH",["HOU","IND","JAX","TEN"],"afc"],["AFC WEST",["DEN","KC","LV","LAC"],"afc"],["NFC EAST",["DAL","NYG","PHI","WSH"],"nfc"],["NFC NORTH",["CHI","DET","GB","MIN"],"nfc"],["NFC SOUTH",["ATL","CAR","NO","TB"],"nfc"],["NFC WEST",["ARI","LAR","SF","SEA"],"nfc"]]};
function tile(a,c){const s=S[a],d=document.createElement('div');d.className='t'+(s?' sold':'');
d.innerHTML=`<div class="bg" style="background:radial-gradient(circle at 30% 20%,${c},#000 88%)"></div><span class="ab">${a}</span>${s&&s.n?`<span class="nm">${s.n}</span>`:''}`;d.onclick=()=>openP(a);d.oncontextmenu=e=>{e.preventDefault();if(S[a])delete S[a];else S[a]={n:''};save();draw()};return d}
function draw(){const b=document.getElementById('board'),T=L[lg],C=Object.fromEntries(T);b.innerHTML='';
if(D[lg]){b.className='div';b.style.gridTemplateColumns='';D[lg].forEach(([n,ts,g])=>{const v=document.createElement('div');v.className='dv '+g;v.innerHTML=`<div class="dh">${n}</div>`;ts.forEach(a=>v.appendChild(tile(a,C[a])));b.appendChild(v)})}
else{b.className='';b.style.gridTemplateColumns='repeat(10,80px)';T.forEach(([a,c])=>b.appendChild(tile(a,c)))}
const n=T.filter(([a])=>S[a]).length,r=T.length-n;
document.getElementById('left').innerHTML='<b>'+r+'</b> '+(r===1?'TEAM':'TEAMS')+' LEFT';
const f=document.getElementById('fin');f.style.display=r>0&&r<=10?'block':'none';document.getElementById('left').style.display=r>10?'':'none';if(f.dataset.r!==String(r)){f.dataset.r=r;f.innerHTML='<span class="in">'+(r===1?'<span>LAST</span> TEAM':'FINAL <span>'+r+'</span> TEAMS')+'</span>';f.classList.remove('pop');void f.offsetWidth;f.classList.add('pop')}
const w=document.getElementById('wrap'),full=r===0;
if(full){const cards=T.map(([a,c])=>`<div class="mc"><div class="lg" style="background:radial-gradient(circle at 30% 20%,${c},#000 88%)">${a}</div><div class="bn"><small>${a}</small>${(S[a].n||'—').replace(/</g,'&lt;')}</div></div>`).join('');const t=document.getElementById('trk');t.innerHTML=cards+cards;t.style.setProperty('--d',(T.length*2.2)+'s')}
w.classList.toggle('full',full);showInfo()}
function nk(){return 'rb_next_'+lg}
function showInfo(){const nx=(localStorage[nk()]||'').trim(),f=document.getElementById('fnx');f.innerHTML=nx?'<b>NEXT UP:</b>'+esc(nx):'';f.style.display=nx?'block':'none';const i=document.getElementById('nxi');if(document.activeElement!==i)i.value=localStorage[nk()]||'';
const pd=(localStorage['rb_prod_'+lg]||'').trim(),op=(localStorage['rb_open_'+lg]||'').trim(),w=document.getElementById('now');w.innerHTML=pd||op?'<small>NOW OPENING</small>'+(pd?'<div class="pr">'+esc(pd)+'</div>':'')+(op?'<div class="op">'+esc(op)+'</div>':''):'';w.style.display=pd||op?'block':'none';
[['pdi','rb_prod_'],['opi','rb_open_']].forEach(([id,k])=>{const e=document.getElementById(id);if(document.activeElement!==e)e.value=localStorage[k+lg]||''})}
function setInfo(){localStorage[nk()]=document.getElementById('nxi').value;localStorage['rb_prod_'+lg]=document.getElementById('pdi').value;localStorage['rb_open_'+lg]=document.getElementById('opi').value;showInfo()}
addEventListener('storage',e=>{if(e.key===key()){load();draw()}else if(e.key==='rb_bn')showBn();else if(e.key===nk()||e.key==='rb_prod_'+lg||e.key==='rb_open_'+lg)showInfo()});
function openP(a){const pp=document.getElementById('pop');if(pp.parentNode!==document.body)document.body.appendChild(pp);cur=a;document.getElementById('pt').textContent=a;const i=document.getElementById('pi');i.value=(S[a]&&S[a].n)||'';document.getElementById('pop').style.display='flex';i.focus()}
function closeP(){document.getElementById('pop').style.display='none'}
function mark(v){if(v)S[cur]={n:document.getElementById('pi').value.trim()};else delete S[cur];save();draw();closeP()}
document.getElementById('pi').addEventListener('keydown',e=>{if(e.key==='Enter')mark(true);if(e.key==='Escape')closeP()});
function showBn(){const b=document.getElementById('bn');b.innerHTML='BREAK #<span id="bnv" contenteditable="true" spellcheck="false" style="outline:none;min-width:1ch;display:inline-block">'+(localStorage.rb_bn||'1')+'</span>';const v=document.getElementById('bnv');v.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();v.blur()}});v.addEventListener('blur',()=>{const t=v.textContent.trim();if(t){localStorage.rb_bn=t}showBn()})}
function editBn(){const v=document.getElementById('bnv');if(!v||document.activeElement===v)return;v.focus();const r=document.createRange();r.selectNodeContents(v);const sl=getSelection();sl.removeAllRanges();sl.addRange(r)}
function bnStep(d){const n=parseInt(localStorage.rb_bn||'1',10)||1;localStorage.rb_bn=String(Math.max(1,n+d));showBn()}
let rstT=null;function resetB(b){if(b.dataset.arm){clearTimeout(rstT);delete b.dataset.arm;b.textContent='Reset';b.style.background='';S={};save();draw();return}b.dataset.arm=1;b.textContent='Tap again to clear';b.style.background='#f0189c';rstT=setTimeout(()=>{delete b.dataset.arm;b.textContent='Reset';b.style.background=''},3000)}

function fitB(){const w=document.getElementById('wrap');if(!w)return;document.body.style.zoom=1;const r=w.getBoundingClientRect();const z=Math.min(innerWidth/(r.right+10),innerHeight/(r.bottom+10));if(z>0)document.body.style.zoom=z}
addEventListener('resize',fitB);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitB);setTimeout(fitB,300);
const _draw=draw;draw=function(){_draw.apply(this,arguments);fitB()};
Object.keys(localStorage).filter(k=>k.startsWith('rb_price_')).forEach(k=>localStorage.removeItem(k));if(QP.has('product'))localStorage['rb_prod_'+lg]=QP.get('product');if(QP.has('opening'))localStorage['rb_open_'+lg]=QP.get('opening');if(QP.has('next'))localStorage[nk()]=QP.get('next');
showBn();load();draw();
</script></body></html>
